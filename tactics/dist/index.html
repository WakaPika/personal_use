<script>(()=>{var Oe={id:"4-3-3",status:"analysis",family:"back4",alias:"シングルピボット＋2人の8番＋3トップ",summary:"1アンカー（6番）＋2人の8番＋3トップ。5レーンを埋めやすく、前線3枚で高い位置からプレスできる。構造的な弱点は6番の脇と、SB・WGの間（SBの背後）。",slots:[{id:"GK",label:"GK",name:"GK",line:"GK",lane:"central"},{id:"LB",label:"SB",name:"左SB",line:"DF",lane:"wide"},{id:"LCB",label:"CB",name:"左CB",line:"DF",lane:"central"},{id:"RCB",label:"CB",name:"右CB",line:"DF",lane:"central"},{id:"RB",label:"SB",name:"右SB",line:"DF",lane:"wide"},{id:"DM",label:"6",name:"6番（アンカー）",line:"MF",lane:"central"},{id:"LCM",label:"8",name:"左8番",line:"MF",lane:"central"},{id:"RCM",label:"8",name:"右8番",line:"MF",lane:"central"},{id:"LW",label:"WG",name:"左WG",line:"FW",lane:"wide"},{id:"ST",label:"CF",name:"CF",line:"FW",lane:"central"},{id:"RW",label:"WG",name:"右WG",line:"FW",lane:"wide"}],shapes:[{id:"base",label:"基本配置 4-3-3",note:"公称配置。6番が2人の8番の後ろに立つ三角形が基準。",pos:{GK:[50,4],LB:[15,24],LCB:[37,18],RCB:[63,18],RB:[85,24],DM:[50,34],LCM:[32,47],RCM:[68,47],LW:[14,66],ST:[50,70],RW:[86,66]}},{id:"ip.235",label:"保持 2-3-5",note:"両SBが6番と同じ高さへ。8番が前線のハーフスペース、WGが大外で前線5枚。残り守備は2CB＋6番。",pos:{GK:[50,6],LCB:[33,20],RCB:[67,20],LB:[16,40],DM:[50,36],RB:[84,40],LW:[6,74],LCM:[31,70],ST:[50,77],RCM:[69,70],RW:[94,74]}},{id:"ip.325",label:"保持 3-2-5",note:"右SBが残って3バック、左SBが6番の横へ入る（インバート）。中央の2ピボットで6番が消されにくい。",pos:{GK:[50,6],LCB:[32,18],RCB:[54,16],RB:[76,20],LB:[40,36],DM:[60,36],LW:[6,74],LCM:[31,70],ST:[50,77],RCM:[69,70],RW:[94,74]}},{id:"oop.high",label:"ハイプレス 4-3-3",note:"CF＋2WGが第1ライン、8番が相手CM／ピボットへジャンプ。6番は中盤の背後を一人で管理。",pos:{GK:[50,9],LB:[16,42],LCB:[38,36],RCB:[62,36],RB:[84,42],DM:[50,52],LCM:[36,66],RCM:[64,66],LW:[22,82],ST:[50,86],RW:[78,82]}},{id:"oop.mid",label:"ミドルブロック 4-1-4-1",note:"WGが中盤ラインまで下がる。6番がCB前、4人の中盤ラインで横幅を守る。",pos:{GK:[50,5],LB:[17,26],LCB:[39,24],RCB:[61,24],RB:[83,26],DM:[50,36],LW:[16,47],LCM:[37,48],RCM:[63,48],RW:[84,47],ST:[50,61]}},{id:"oop.low",label:"ローブロック 4-5-1",note:"中盤5枚がPA前を横幅ごと守る。8番はSBのサポートでクロス対応まで下がる。",pos:{GK:[50,3],LB:[19,14],LCB:[40,12],RCB:[60,12],RB:[81,14],DM:[50,24],LW:[18,29],LCM:[37,31],RCM:[63,31],RW:[82,29],ST:[50,45]}}],facts:[{key:"width",label:"幅",level:3,text:"WGが大外に常駐。保持時はSBも加わり5レーンを埋めやすい。"},{key:"depth",label:"深さ（段差）",level:3,text:"6番–8番–前線の3段。縦パスの角度を作りやすい。"},{key:"central",label:"中央密度",level:2,text:"中央MFは3枚。非保持で4-1-4-1にすると中盤ラインは5枚。"},{key:"buildup",label:"第1ライン",value:"2CB＋6（＋GK）",text:"相手2トップなら3v2、GK込みで4v2。"},{key:"press",label:"第1プレス",value:"CF＋2WG",text:"8番のジャンプで中盤を捕まえる。"},{key:"rest",label:"残り守備",value:"2CB＋6（2+1）",text:"片SBを残せば3+1。"}],phases:{buildUp:"2CB＋6番（＋GK）で第1ラインを作る。相手が2トップなら3v2（GK込み4v2）、1トップならCBが運べる。6番が背中で消されたら、6番がCB間に降りて3枚化するか、片SB／8番が降りて2ピボットにする。",progression:"8番が相手MFラインの外側・背後（ハーフスペース）に立ち、WGは大外で相手SBをピン留めする。6番への縦パス、CBの持ち運び、SB経由の外循環が主な前進ルート。",finalThird:"WG（大外）＋8番（ハーフスペース）＋CF（中央）で前線5レーンを埋める。SBの追い越しで大外2v1を作り、カットバックとファーへのクロスを狙う。",highPress:"CF＋2WGが第1ライン、8番がジャンプして相手CM／ピボットを捕まえる。WGが内側から寄せてSBを背中で消す方法と、外から寄せて中央の罠へ誘導する方法がある。",midBlock:"WGが下がって4-1-4-1。6番がCB前のスペースをスクリーンし、8番は中央を優先して閉じる。外を越えられたら8番がスライドしてSBを助ける。",lowBlock:"4-5-1。8番がSBの背後をカバーしてクロスに対応し、CBがPAの外へ釣り出されないようにする。",attTransition:"奪ったらWGの幅を使った速い展開が第一の出口。CFは中央で起点を作り、逆WGが背後へ、8番が2列目から追い越す。",defTransition:"ボール周辺の8番・WG・CFで即時奪回（カウンタープレス）。後方は2CB＋6番（＋片SB）で背後と最初の縦パスを管理する。",restDefence:"両SBを高くすると2CB＋6番の2+1。相手が2トップなら同数に近づくため、片SBを残した3+1（3-2-5）に切り替える判断が多い。"},roles:[{slot:"DM",title:"6番（アンカー）",text:"第1ライン直後の受け手。前を向けるかで前進の質が決まる。非保持ではCB前のスペースと8番の背後を一人でカバーする。"},{slot:"LCM",title:"8番",text:"ハーフスペースで受けて前進し、PAへ遅れて侵入。非保持では相手CM／ピボットへのジャンプ役。"},{slot:"LW",title:"WG",text:"大外で相手SBをピン留めし1v1。非保持はSBへのコースを消しながらCBへ寄せ、ブロックではSHの位置まで戻る。"},{slot:"ST",title:"CF",text:"CB間でピン留めと裏抜け、降りて8番やWGを使う。相手が3CBだと数的に孤立しやすい。"},{slot:"LB",title:"SB",text:"保持では大外の幅役か、内側に入る2枚目のピボット（インバート）。非保持はWGと縦関係で大外を守る。"},{slot:"LCB",title:"CB",text:"幅を取って相手FWの間隔を広げ、空いたら運ぶ。残り守備の最後尾として相手CFの背後抜けを管理。"},{slot:"GK",title:"GK",text:"ビルドアップの+1。相手2トップに対して第1ラインを4v2にできるかは足元の質次第。"}],strengths:[{title:"前線3枚で高い位置から圧力",why:"CF＋2WGが相手CB・SBの近くに立てるため、ボールを失った直後やハイプレスで人数をかけやすい。8番のジャンプで中盤も捕まえられる。",sources:["cv-433"]},{title:"5レーンを埋めやすい",why:"WGが大外、8番がハーフスペース、CFが中央。SBが上がれば大外で2v1も作れる。",sources:["cv-433","sv-halfspace"]},{title:"中央の三角形",why:"6番＋8番2枚の段差でパスの角度が生まれる。中央MFが2枚の相手には中央で+1になりやすい。",sources:["cv-433","cv-433-key"]}],weaknesses:[{title:"6番の脇",why:"6番は1人で横幅を守るため、8番が前へジャンプした瞬間に脇（ハーフスペース）が空く。相手の10番や降りるFWの受け場所になる。",sources:["cv-433"]},{title:"SBとWGの間、SBの背後",why:"WGが高く残るとSBが大外で数的不利になり、素早いサイドチェンジでその状態を突かれやすい。",sources:["cv-433"]},{title:"1トップの孤立",why:"相手が2CB・3CBならCFは常に数的不利。WG・8番の押し上げが遅いと起点を作れない。",sources:["cv-433"]},{title:"両SB前進時の残り守備",why:"2CB＋6番の3枚で相手2トップを見ると+1しかなく、6番がボールへ出ると2v2になる。",sources:["cv-restdef"]}],variations:{ip:[{shape:"ip.235",label:"2-3-5",text:"両SBが上がり、8番が前線のハーフスペースへ。前線の人数と幅は最大、残り守備は2CB＋6番。"},{shape:"ip.325",label:"3-2-5",text:"片SBが残って3バック、逆SBが6番の横へ（インバート）。2トップの相手に6番を消されにくい。"},{label:"6番落とし（西: salida lavolpiana）",text:"6番がCBの間へ降りて第1ラインを3枚化。2トップのプレスに+1を作るが、中盤中央は1枚減る。"}],oop:[{shape:"oop.high",label:"ハイプレス 4-3-3",text:"CF＋WGで第1ライン、8番がジャンプ。"},{shape:"oop.mid",label:"ミドル 4-1-4-1",text:"WGが中盤ラインへ。6番がCB前をスクリーン。"},{shape:"oop.low",label:"ロー 4-5-1",text:"中盤5枚でPA前を横幅ごと守る。"}]},sources:["cv-433","cv-433-key","cv-restdef","cv-4141","sv-halfspace","es-lavolpiana","bradley2011","tierney2016"]};var Ve={id:"4-4-2",status:"analysis",family:"back4",alias:"2トップ＋フラットな4-4の2ライン",summary:"2トップ＋4枚の2ライン。2トップが相手CB2枚を同時に固定でき、2列の横スライドでコンパクトに守りやすい。中央MFが2枚のため、3枚の中盤には人数とパス角度で不利になりやすい。",slots:[{id:"GK",label:"GK",name:"GK",line:"GK",lane:"central"},{id:"LB",label:"SB",name:"左SB",line:"DF",lane:"wide"},{id:"LCB",label:"CB",name:"左CB",line:"DF",lane:"central"},{id:"RCB",label:"CB",name:"右CB",line:"DF",lane:"central"},{id:"RB",label:"SB",name:"右SB",line:"DF",lane:"wide"},{id:"LM",label:"SH",name:"左SH",line:"MF",lane:"wide"},{id:"LCM",label:"CM",name:"左CM",line:"MF",lane:"central"},{id:"RCM",label:"CM",name:"右CM",line:"MF",lane:"central"},{id:"RM",label:"SH",name:"右SH",line:"MF",lane:"wide"},{id:"LS",label:"CF",name:"左CF",line:"FW",lane:"central"},{id:"RS",label:"CF",name:"右CF",line:"FW",lane:"central"}],shapes:[{id:"base",label:"基本配置 4-4-2",note:"公称配置。DF4・MF4・FW2の3ライン。",pos:{GK:[50,4],LB:[15,24],LCB:[37,18],RCB:[63,18],RB:[85,24],LM:[15,46],LCM:[39,42],RCM:[61,42],RM:[85,46],LS:[41,65],RS:[59,65]}},{id:"ip.244",label:"保持 2-4-4",note:"SBが上がってCMと同じ高さへ。SHは内側の高い位置、2トップと並んで前線4枚。",pos:{GK:[50,6],LCB:[35,20],RCB:[65,20],LB:[12,42],LCM:[40,39],RCM:[60,39],RB:[88,42],LM:[22,68],LS:[42,76],RS:[58,76],RM:[78,68]}},{id:"oop.high",label:"ハイプレス 4-4-2",note:"2トップが相手CBへ。SHは相手SB、CMは相手の中盤を捕まえる位置まで押し上げる。",pos:{GK:[50,9],LB:[16,42],LCB:[38,36],RCB:[62,36],RB:[84,42],LM:[18,64],LCM:[40,58],RCM:[60,58],RM:[82,64],LS:[40,82],RS:[60,82]}},{id:"oop.mid",label:"ミドルブロック 4-4-2",note:"2トップが相手ピボットへのコースを背中で消し、SHが絞ってフラットな4枚を作る。",pos:{GK:[50,5],LB:[16,26],LCB:[39,24],RCB:[61,24],RB:[84,26],LM:[19,43],LCM:[40,41],RCM:[60,41],RM:[81,43],LS:[42,57],RS:[58,57]}},{id:"oop.low",label:"ローブロック 4-4-1-1",note:"2列を低く。FWの1枚が下がって相手ピボットを見る。",pos:{GK:[50,3],LB:[18,14],LCB:[39,12],RCB:[61,12],RB:[82,14],LM:[20,28],LCM:[40,27],RCM:[60,27],RM:[80,28],LS:[50,39],RS:[52,52]}}],facts:[{key:"width",label:"幅",level:2,text:"SHが幅を担当。保持時はSBが上がって大外を取る。"},{key:"depth",label:"深さ（段差）",level:1,text:"同じライン上に並びやすく、ライン内の段差が少ない。"},{key:"central",label:"中央密度",level:1,text:"中央MFは2枚。SHが絞れば非保持で4枚。"},{key:"buildup",label:"第1ライン",value:"2CB＋2CM",text:"ボックス型。2トップへの長いボールも常に選択肢。"},{key:"press",label:"第1プレス",value:"2トップ",text:"相手CB2枚を同時に見られる。"},{key:"rest",label:"残り守備",value:"2CB＋2CM（2+2）",text:"SBを上げても4枚が残りやすい。"}],phases:{buildUp:"2CB＋2CMのボックス、またはSB経由で前進する。2トップへの長いボールで相手の最終ラインと直接勝負する選択肢を常に持てる。",progression:"SB→SH→CFの縦の連係と、2トップの縦関係（片方が降りて受け、片方が背後へ）。中央は2枚なので、外→中の順で前進することが多い。",finalThird:"2トップでPA内にニアとファーの2人を確保できる。SHの内側侵入とSBのオーバーラップで大外からクロス。",highPress:"2トップが相手CBへ寄せ、外へ追い出してサイドで閉じ込めるか、内へ誘導して中央の罠にかける。後方のFWが背後から挟み、CMが前から寄せる形もある。",midBlock:"2トップが相手ピボットへのコースを背中で消し、SHが絞ってフラットな4枚を作る。2列のままボールサイドへ横スライドしてコンパクトさを保つ。",lowBlock:"4-4の2ラインを低く構え、FWの1枚が下がって4-4-1-1や4-5-1になる。PA前の中央を2列で埋める。",attTransition:"奪ったら2トップが即座の出口。1人が足元で起点を作り、もう1人が背後へ走る。SHが外から追い越す。",defTransition:"2CMと2CBが中央を締め、SHが帰陣する。2トップは相手の最初のパス（CB・ピボット）を遅らせる。",restDefence:"SBを上げても2CB＋2CMの4枚が残りやすい。相手が1トップなら後方は大きな数的優位。"},roles:[{slot:"LS",title:"CF（2トップ）",text:"2人で相手CB2枚を固定する。ターゲットと裏抜けの組み合わせ。非保持では第1ラインと、相手ピボットへのカバーシャドウ。"},{slot:"LCM",title:"CM",text:"2枚で中央を横幅ごと守る。片方が前に出たら片方は残る。セカンドボール回収の中心。"},{slot:"LM",title:"SH",text:"保持時は幅か内側の受け手、非保持は絞って中盤4枚目。大外の守備と中央の補助を両立する負荷が最も大きい。"},{slot:"LB",title:"SB",text:"SHと縦関係で大外を担当。相手WGやWBとの1対1が多い。"},{slot:"LCB",title:"CB",text:"相手2トップとは2v2になりやすく、対人の強さが要求される。相手1トップなら+1。"},{slot:"GK",title:"GK",text:"ロングボールの起点と背後のカバー。"}],strengths:[{title:"2トップがCB2枚を固定",why:"相手最終ラインの中央に2v2を作り、CBのどちらも前に出にくくする。",sources:["cv-442","cv-twoupfront"]},{title:"明確な2ラインで横スライドが容易",why:"4枚×2列はボールサイドへのスライドでコンパクトさを保ちやすい。",sources:["cv-442"]},{title:"奪った後の出口と人数",why:"前線に2人残るため、奪った瞬間の出口と追い越しの人数を確保できる。",sources:["cv-442"]}],weaknesses:[{title:"中央2枚 vs 中盤3枚",why:"相手が6番＋8番2枚なら中央は2v3。SHが絞れば同数にできるが、今度は大外が空く。",sources:["cv-442","cv-442-diamond"]},{title:"段差の少なさ（ライン間）",why:"同じ高さに並ぶため、選手間を通す縦パス1本で複数人が外されやすい。",sources:["cv-442"]},{title:"第1ラインが3枚になると数的不利",why:"相手が3バックや6番落としで第1ラインを3枚にすると、2トップでは1人余る。",sources:["es-lavolpiana"]}],variations:{ip:[{shape:"ip.244",label:"2-4-4",text:"SBが上がり、SHが内側の高い位置へ。前線4枚で相手最終ラインを押し下げる。"},{label:"4-4-1-1（2トップの縦関係）",text:"FWの1枚が降りて中盤とつなぐ。中央の人数不足を補う。"}],oop:[{shape:"oop.high",label:"ハイプレス 4-4-2",text:"2トップが相手CBへ。外切りでサイドに閉じ込める。"},{shape:"oop.mid",label:"ミドル 4-4-2",text:"SHが絞ったフラット4。2トップがピボットを消す。"},{shape:"oop.low",label:"ロー 4-4-1-1",text:"FW1枚がピボット番。2列を低く。"},{label:"ダイヤモンド（4-1-2-1-2）",text:"中央の人数不足を解消する別形。幅は失う。"}]},sources:["cv-442","cv-twoupfront","cv-442-diamond","es-lavolpiana","bradley2011","tierney2016"]};var Ue={id:"4-2-3-1",status:"analysis",family:"back4",alias:"ダブルボランチ＋トップ下＋1トップ",summary:"ダブルボランチ（2ピボット）＋トップ下（10番）＋1トップ。2枚のボランチで中央と残り守備を安定させ、10番がライン間で受ける。非保持では10番が上がって4-4-2や4-4-1-1になりやすい。",slots:[{id:"GK",label:"GK",name:"GK",line:"GK",lane:"central"},{id:"LB",label:"SB",name:"左SB",line:"DF",lane:"wide"},{id:"LCB",label:"CB",name:" で第1・第2ラインを作る。相手が1トップなら、ボランチのどちらかが前向きでフリーになりやすい。",progression:"10番が相手MFラインの背後（ライン間）で受け、SHは内と外を使い分ける。ボランチの片方が前進して8番化すると中盤3枚になる。",finalThird:"SH＋10番＋CFの4人で最終ライン前を攻め、SBが大外を取る。1トップはPA内の人数が少なくなりやすく、逆SHのファー侵入が鍵。",highPress:"10番が1列上がって4-4-2化。CFがCBへ寄せ、10番は相手ピボットを背中で消すか捕まえる。",midBlock:"4-4-1-1。逆サイドのSHが絞って中央に1枚加える。ボランチがCB前を守り、片方が前に出て10番やSHとプレスする。",lowBlock:"4-5-1や4-4-1-1で低く守り、1トップは高めに残してカウンターの起点にする。",attTransition:"10番＋SH＋CFの3人が速い出口。1トップへの縦パスと、10番のサポートの距離が鍵。",defTransition:"2枚のボランチが即座に中央を保護し、2CBと合わせた4枚で残り守備を作る。",restDefence:"2CB＋2ボランチの2+2を作りやすく、両SBを同時に上げやすい。"},roles:[{slot:"AM",title:"10番（トップ下）",text:"ライン間の受け手。非保持では最も位置を変える選手で、上がって第1ラインに入るか、下がって相手ピボットを見る。"},{slot:"LDM",title:"ボランチ（2ピボット）",text:"2枚で横幅を分担し、片方が前、片方が残る。CB前のスペースを守り、SBの前進を支える。"},{slot:"LM",title:"SH",text:"保持時は内側のポケットと大外を使い分け、非保持は相手SBへの対応。"},{slot:"ST",title:"CF（1トップ）",text:"背負う・裏へ抜ける・プレスを始める。CB2枚に対して孤立しやすい。"},{slot:"LB",title:"SB",text:"ボランチ2枚の保護があるため、両SBが同時に上がりやすい。"},{slot:"LCB",title:"CB",text:"相手1トップには+1。ボランチとの4枚で前進の土台を作る。"},{slot:"GK",title:"GK",text:"4枚のビルドアップに加わって+1を作る。"}],strengths:[{title:"2+2で中央が安定",why:"ボランチ2枚がCB前を守るため、両SBの同時前進やボールロスト後の中央保護がしやすい。",sources:["cv-4231","cv-doublepivot"]},{title:"ライン間の10番",why:"相手MFラインの背後に常駐する受け手がいるので、縦パス1本で前進できる。",sources:["cv-4231"]},{title:"4-4-2への切替が速い",why:"10番が1列上がるだけで第1ラインが2枚になり、ハイプレスへ移行できる。",sources:["cv-4231"]}],weaknesses:[{title:"1トップの孤立",why:"相手CB2枚に対してCFが1人。10番やSHの距離が遠いと起点を作れない。",sources:["cv-4231"]},{title:"10番が高すぎると中盤で数的不利",why:"非保持で10番が戻らないと、ボランチ2枚 vs 相手の中盤3枚になる。",sources:["cv-4231"]},{title:"ボランチの横並び",why:"2枚が同じ高さに並ぶと、片方が釣り出された瞬間に背後のスペースが広がる。",sources:["cv-doublepivot"]}],variations:{ip:[{shape:"ip.2413",label:"2-4-1-3",text:"両SBがボランチと同じ高さへ。SHは内側、10番はライン間。"},{label:"3-2-4-1（片SB残し）",text:"片SBが残って3バック化。SHと10番、CFで前線を厚くする。"}],oop:[{shape:"oop.high",label:"ハイプレス 4-4-2",text:"10番がCFの横へ上がる。"},{shape:"oop.mid",label:"ミドル 4-4-1-1",text:"10番が相手ピボット番。"},{shape:"oop.low",label:"ロー 4-4-1-1",text:"CFは高めに残してカウンター要員。"}]},sources:["cv-4231","cv-4231-key","cv-doublepivot","tie look:"CMとSHの間（ハーフスペース）",why:"SHが絞れば外のSB、CMが出れば6番が空く。どちらかを強制できているか。",scene:"ip-prog",at:[24,57]},{text:"SBを上げた後、2CB＋6番が2トップに+1を保てているか",look:"自陣側のセンターライン付近",why:"6番が即時奪回に出ると2CB vs 2トップの2v2。上がったSBの裏が狙われる。",scene:"tr-loss",at:[75,31]}],B:[{text:"2トップは6番を背中で消しながらCBへ寄せられているか",look:"2トップの間と、その背後の6番",why:"6番を消せないと中盤中央で2v3。片方を6番番にすると第1ラインは1v2。",scene:"ip-build",at:[50,42]},{text:"SHは8番を見るのか、SBを見るのか",look:"SHとCMの間",why:"SHが絞ると外のSBが、出ると8番が空く。CMとの受け渡しが噛み合っているか。",scene:"ip-prog",at:[77,59]},{text:"奪った瞬間、2トップで相手SBの裏を突けているか",look:"相手SBの背後",why:"相手が2-3-5で攻めているとき、残り守備は2CB＋6番の3人だけ。",scene:"tr-loss",at:[24,12]}]},superiority:[{kind:"numerical",zone:"第1ライン（{A}保持）",a:3,b:2,text:"{A}の2CB＋6番 vs {B}の2トップ。GKを含めると4v2。",when:"2トップが横並びでCBへ出ているとき"},{kind:"numerical",zone:"中盤中央",a:3,b:2,text:"{A}の6番＋8番2枚 vs {B}のCM2枚。",when:"{B}のSHが外にいるとき。SHが絞れば3v4"},{kind:"numerical",zone:"{A}の最前線",a:3,b:4,text:"{A}のWG・CF・WG vs {B}の4バック。{A}はWGのピン留め（位置）で補う。",when:"常に（公称配置）"},{kind:"numerical",zone:"{B}の最前線",a:3,b:2,text:"{B}の2トップ vs {A}の2CB＋6番。6番が前に出ると2v2。",when:"{A}が両SBを上げているとき"},{kind:"positional",zone:"ライン間",holder:"A",text:"{A}の8番が{B}のCMとSHの間・背後に立てば、{B}の2列の間で前を向ける。",when:"{B}の2列の距離が開いたとき"},{kind:"positional",zone:"最終ライン中央",holder:"B",text:"{B}の2トップが{A}のCB2枚を固定し、CBが前に出て潰しにくくなる。",when:"6番がCBの前にいないとき"},{kind:"qualitative",zone:"大外の1v1",holder:"A",text:"{A}のWG vs {B}のSB。WGが1v1で勝てる選手なら、大外のアイソレーションが最も速い崩し。",when:"WGの個の質が高い場合のみ"},{kind:"qualitative",zone:"空中戦",holder:"B",text:"{B}のCF vs {A}のCB。空中戦に強いCFがいれば、ロングボールで中盤を飛ばせる。",when:"CFの空中戦の質が高い場合のみ"}],freemen:[{who:"{A}の6番",when:"{B}の2トップが横並びでCB2枚へ寄せたとき",scene:"ip-build"},{who:"{A}のSB（ボールサイド）",when:"{B}のSHが8番を見て内側へ絞ったとき",scene:"ip-prog"},{who:"{B}のGK",when:"{A}が前線5人でボールサイドを閉じたとき（GK経由で逆サイドへ）",scene:"oop-press"},{who:"{A}のCB",when:"{B}がFW1枚を6番番に下げたとき",scene:"adj-b-4411"}],interplay:[{builder:"A",build:"2CB＋6（＋GK）",press:"2トップ（＋CMのジャンプ）",a:3,b:2,key:"2トップが6番を消せばCBが、CBに出れば6番が空く。",escape:"6番落とし／SBのインバート／GKを使った+1",scene:"ip-build"},{builder:"B",build:"2CB＋2CM（＋GK）",press:"CF＋2WG（＋8番のジャンプ）",a:3,b:3,key:"第1ラインはGKを含めて同数。WGがCBに出ればSB、SBに出ればCBが空く。",escape:"GK経由の逆サイド／2トップへのロングボール",scene:"oop-press"}],restDefence:{A:{shape:"2CB＋6番（2+1）",vs:"{B}の2トップ",a:3,b:2,note:"6番が即時奪回に出ると2v2。片SBを残せば4v2（3+1）。"},B:{shape:"2CB＋2CM（2+2）",vs:"{A}のCF（＋WG）",a:1,b:4,note:"SBが上がると、その背後に{A}のWGが残る。"}},duels:[{a:"6番",b:"2トップ",text:"6番が2トップの背後で前を向けるか。2トップが背中で消せるか。",scene:"ip-build"},{a:"8番",b:"CM・SH",text:"8番がハーフスペースで受けたとき、SHが絞るのか、CMが出るのか。",scene:"ip-prog"},{a:"WG",b:"SB",text:"大外の1v1とピン留め。WGが内側に入ったとき、SBが付いて行くか。",scene:"ip-prog"},{a:"SB",b:"SH",text:"{A}のSBが上がったとき、{B}のSHが下がって付くのか、前に残ってカウンターの起点になるのか。",scene:"tr-win"},{a:"CB",b:"2トップ",text:"残り守備で2v2にされないか（6番の位置）。ロングボールの競り合い。",scene:"tr-loss"}],mechanisms:[{id:"m-firstline",attacker:"A",phase:"buildup",scene:"ip-build",evidence:"I",title:"第1ライン3v2：6番が2トップの背後で前を向く",premise:"{B}の2トップが横並びのまま{A}のCB2枚へ寄せ、6番へのコースを背中で消せていない。",setup:"{A}は2CB＋6番（＋GK）、{B}は2トップ。第1ラインは3v2、GKを含めると4v2。",phenomenon:"CBから2トップの間を通す縦パスが6番に入り、6番が{B}の中盤ラインの前で前を向く。",aim:"6番から8番（CMの外側）やWGへ展開し、{B}の中盤4枚を横に動かしてから縦へ。",counter:"2トップを縦関係にして1人が6番を消す。またはCMの1枚が6番へジャンプする。",readjust:"6番がCBの間に降りて3枚化する（西: salida lavolpiana）か、8番やSBを6番の横へ入れて受け手を2人にする。",exception:"GKやCBが足元でプレスを外せないと+1は形だけになり、{B}はCBへ寄せるだけでミスを誘える。",sources:["cv-442","cv-433","es-lavolpiana","uefa-ucl-2223"]},{id:"m-halfspace8",attacker:"A",phase:"progression",scene:"ip-prog",evidence:"I",title:"8番がCMとSHの間で受ける：SBか6番のどちらかが空く",premise:"{B}のCM2枚が中央で6番と8番の両方を見ていて、SHは外の{A}のSBを基準に立っている。",setup:"{A}の8番が{B}のCMとSHの間（ハーフスペース）、WGは大外で{B}のSBをピン留め。中盤中央は3v2。",phenomenon:"8番に縦パスが入ると、{B}はSHを絞らせるかCMを出すかを迫られる。SHが絞れば{A}のSBが、CMが出れば6番が空く。",aim:"空いたSBが運んでWGと大外2v1を作る。または空いた6番を経由して逆サイドへ。",counter:"SHを最初から内側に絞ってコンパクトに守り、外のSBにはボールが出てからスライドする。CMとSHで8番を挟む。",readjust:"SB経由で{B}のブロックを横に動かし、逆サイドの大外（WG）へ大きく展開する。",exception:"{B}のSBが8番まで前に出て捕まえる（マンツーマン寄り）なら、WGの背後へのランが主な狙いに変わる。",sources:["cv-442","cv-433","sv-halfspace"]},{id:"m-wide2v1",attacker:"A",phase:"final",scene:"ip-prog",evidence:"I",title:"大外2v1からのカットバック",premise:"{B}のSHが8番を見て内側に残り、{B}のSBが大外で{A}のWGとSBの2人を見ている。",setup:"大外は{A}のWG＋SB vs {B}のSBで2v1。PA内は{A}のCF＋逆WG＋8番 vs {B}の2CB＋逆SB。",phenomenon:"WGが内側へ運ぶとSBが外を追い越す（逆も可）。{B}のSBはどちらか一方しか止められない。",aim:"PA角からのカットバックを、遅れて入る8番や逆WGへ。",counter:"SHが下がって大外を2v2に戻す（6バック気味）。CMがスライドしてPA前を埋める。",readjust:"{B}のSHが下がった分、PA前で8番が空く。そこからのミドルシュートや縦パスへ。",exception:"WGに1v1で仕掛ける質がない、またはSBの攻撃参加が遅いと2v1は作れない。",sources:["cv-433","cv-442"]},{id:"m-press-gk",attacker:"B",phase:"buildup",scene:"oop-press",evidence:"I",title:"{A}のハイプレス：WGがSBを消し、GKが{B}の+1になる",premise:"{A}がCF＋2WGで第1ラインを作り、8番が{B}のCMへジャンプしてくる。",setup:"{B}は2CB＋2CM＋GK、{A}はCF・WG2枚・8番2枚。WGがCBとSBの間から寄せてSBへのコースを消し、CFが逆CBへのパスを切る。",phenomenon:"ボールサイドは閉じられるが、GKを使えば{B}は1人余る。GK経由で逆サイドのCB→SBへ出られると、{A}の逆WGとSBが遅れて押し上げることになる。",aim:"GKを使った逆サイドへの展開、または2トップへのロングボールでプレスを一気に越える。",counter:"GKへのバックパスをトリガーに逆WGがCBへ、{A}のSBが{B}のSBへ縦にスライドする。6番はロングボールの落下点とセカンドに備える。",readjust:"{B}はSHを内側に絞らせてセカンドボールの回収人数を増やしてから、2トップへ蹴る。",exception:"{B}のGKが足元で数的優位を使えない場合、{A}のプレスは前線5人でほぼ完結する。",sources:["cv-433","cv-highpress","cv-442"]},{id:"m-longball",attacker:"B",phase:"progression",scene:"oop-press",evidence:"I",title:"2トップへのロングボールとセカンド回収",premise:"{A}が高い位置から人数をかけてプレスし、{B}の足元のビルドアップが詰まっている。",setup:"{B}の2トップ vs {A}の2CB。6番が下がれば3v2だが、下がらなければ2v2。",phenomenon:"1人が競り、もう1人がフリックの背後（CBとSBの間のチャネル）へ走る。{A}のSBが高い位置にいるとチャネルが広い。",aim:"落としたボールを{B}のCM・SHが前向きで拾い、2列目から攻める。",counter:"CB1枚が競り、もう1枚がカバー。6番が落下点の前でセカンドを拾い、SBは高さを下げてチャネルを閉じる。",readjust:"{B}はSHを内側へ絞らせてセカンド回収の人数を増やす。",exception:"{B}の2トップが空中戦で劣るとロングボールは単なるボールロストになる。",sources:["cv-twoupfront","cv-442"]},{id:"m-wide-overload",attacker:"B",phase:"wide",scene:"oop-block",evidence:"I",title:"WGの帰陣が遅れると大外で2v1",premise:"{A}のWGが攻撃後に高い位置に残り、4-1-4-1のブロックへの戻りが遅い。",setup:"大外で{B}のSB＋SH vs {A}のSBが2v1。{A}の8番がスライドしなければ解消できない。",phenomenon:"{B}のSBが追い越し、{A}のSBはSHとSBの2人を見ることになる。8番が外へ出ると、6番が中央で1人になる。",aim:"大外の2v1からクロス。2トップでニアとファーを同時に攻める。",counter:"WGを中盤ラインまで戻して4-1-4-1を保つ。間に合わなければ8番が外へスライドし、6番はハーフスペースを優先して守る。",readjust:"{B}は8番がスライドした瞬間に、中央（6番の脇）へ斜めのパスを入れる。",exception:"{A}がWGに帰陣を求めない（前残り）設計なら、カウンターの出口と引き換えに大外の数的不利を受け入れている。",sources:["cv-433","cv-4141"]},{id:"m-drop-striker",attacker:"B",phase:"progression",scene:"oop-block",evidence:"I",title:"2トップの1人が6番の脇へ降りる",premise:"{A}が4-1-4-1で守り、8番が{B}のCMやSBへ前に出ている。",setup:"{A}の6番は1人で中央の横幅を守る。{B}の2トップの1人が降りると、{A}のCBは付いて行くかどうか迷う。",phenomenon:"降りたFWが6番の脇で前を向くか、ワンタッチで落とし、もう1人のFWが空いたCBの背後へ走る。",aim:"6番の脇で前を向き、2トップの縦関係で中央を割る。",counter:"CBが前に出て潰す（6番の保護があるので出やすい）。逆のCBとSBが絞ってカバーし、8番は戻りながら挟む。",readjust:"CBが前に出た瞬間、もう1人のFWがその背後へ走る。",exception:"{A}が6番の横に8番を残す（4-2-3-1寄りの守備）なら脇は空きにくい。",sources:["cv-433","cv-4141"]},{id:"m-rest-3v2",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のロスト直後：残り守備3v2と、上がったSBの裏",premise:"{A}が2-3-5で攻め、両SBが高い位置にいる状態でボールを失う。",setup:"{A}の残り守備は2CB＋6番の3人、{B}は2トップ。3v2だが、6番が即時奪回に出ると2v2。",phenomenon:"{B}は奪った最初のパスで、2トップの足元か、上がった{A}のSBの背後（CBとSBの間）へボールを出す。",aim:"2トップの1人が背後へ、もう1人が足元で起点。逆SHが外から全力で追い越す。",counter:"ボール周辺の8番・CF・WGで即時奪回（カウンタープレス）。6番は出ずに縦パスのコースを消し、CBは降りるFWを前で潰す。",readjust:"{A}は片SBを残して3+1にする（3-2-5）。攻撃の人数は減るがカウンターのリスクを下げる。",exception:"{B}がSHまで低い位置で守っているとカウンターの人数が足りず、2トップだけの攻撃になる。",sources:["cv-restdef","forcher2023rest","peters2025","cv-counterpress"]},{id:"m-counter-wide",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"{B}のSBが上がった背後へ、WGが最初のパスを受ける",premise:"{B}がSHを内側に入れ、SBを高く上げて攻めている最中に、{A}が中央でボールを奪う。",setup:"{A}のWGは4-1-4-1のブロックで大外・中盤の高さにいる。{B}の最終ラインは2CB（＋CM2枚）。",phenomenon:"{B}のSBの背後に{A}のWGが残っているため、最初のパスを外へ出せば、{B}の2CBに{A}のWG・CF・逆WGの3人で向かえる。",aim:"8番からWGへ外へ出し、WGが運ぶ間にCFと逆WGがPAへ入る。",counter:"{B}のCM1枚がすぐに遅らせ、もう1枚とSHが戻る。ファウルで止める判断も含め、最初のパスを外へ出させない。",readjust:"{A}の6番・8番が追い越しを遅らせず、2列目の人数を加える。",exception:"{B}がSBを上げずに4枚を残して攻めているなら、このカウンターは成立しにくい。",sources:["cv-433","cv-att-transitions"]}],adjustments:[{id:"adj-4411",by:"B",scene:"adj-b-4411",title:"FW1枚を6番番に下げる（4-4-1-1）",trigger:"{A}の6番が2トップの背後で前を向き続ける。",change:"片方のCFが6番をマークし、もう一方が1人でCB2枚を見る。",effect:"6番は消えるが、第1ラインは{A}の2CB vs CF1枚の2v1。CBが運べる。",response:{by:"A",text:"フリーのCBが運んで{B}のSHかCMを1枚引き出す。8番が6番の横へ降りて受け手を2人にする。"}},{id:"adj-invert",by:"A",scene:"adj-a-invert",title:"SBをインバートして2ピボット化（3-2-5）",trigger:"{B}の2トップのカバーシャドウで6番が消される。",change:"左SBが6番の横へ入り、右SBは残って3バックの右に。",effect:"2トップでは2CB＋2ピボットを同時に消せず、{B}はCMを前に出すしかない。CMが出た背後で8番が前を向く。",response:{by:"B",text:"SHが内側に絞ってインバートしたSBを捕まえる。その分、大外で{A}のWGと{B}のSBが1v1になる。"}},{id:"adj-6back",by:"B",title:"SHを最終ラインまで下げる（6バック気味）",trigger:"大外の2v1からクロスやカットバックを作られる。",change:"SHが{A}のSBに付いて最終ラインの外まで下がる。",effect:"大外は2v2で止まるが、中盤ラインがCM2枚だけになり、PA前で{A}の8番・6番が空く。",response:{by:"A",text:"8番をPA前に置き、カットバックとミドルシュートの受け手にする。"}},{id:"adj-press442",by:"A",title:"8番を1枚上げて4-4-2型でプレス",trigger:"{B}がGK経由で逆サイドへ逃げ、プレスを外される。",change:"8番の1枚がCFの横へ上がってCB2枚を2人で見る。WGは{B}のSBへ。",effect:"GKの+1を消しやすくなるが、6番の横の人数が減る。ロングボールが通るとセカンド回収で数的不利になる。",response:{by:"B",text:"2トップへ早めに蹴り、SHを内側に絞らせてセカンドボールを拾う。"}}],setPieces:[{title:"{A}の攻撃CK",text:"{B}がFWを1〜2人前線に残すと、{A}は2CB＋6番（＋SB）をカウンター対応に残す必要があり、PA内に送れる人数が減る。",evidence:"I"},{title:"{B}の攻撃CK",text:"{B}は2CB＋2トップの4人を空中戦に送りやすい。{A}は前線3人のうち誰をカウンターの出口に残すかと、PA内のマーク人数のトレードオフになる。",evidence:"I"},{title:"セカンドボール",text:"PA外の回収地点では{A}の8番2枚と{B}のCM2枚が競る。ここで負けると2次攻撃が続く。",evidence:"I"},{title:"スローイン",text:"通常配置から独立した局面。ボールサイドは{A}のSB・WG・8番と{B}のSB・SH・CMで同数になりやすく、逆サイドへの逃げ道を誰が消すかが論点。",evidence:"P"}],validity:{assumptions:["{B}は2トップを横並びに保つゾーン基準の4-4-2で守り、SHは自分の前の{A}のSBを基準に動く。","{A}はSBを高く上げ、8番がハーフスペースへ入る保持スタイル。","両チームとも公称の基本形から大きく可変しない。"],exceptions:["{B}がマンツーマン寄り（CMが8番に、FWが6番に付いて来る）なら、中央の+1は「人を引き出す」効果に変わり、CBの持ち運びと背後へのランが主題になる。","{B}がSHを最終ラインまで下げる低いブロックなら、中央の3v2より大外のポケットとクロスの質が主題になる。","{A}が保持でSBをインバートする（3-2-5）なら、6番の脇とSBの裏の構造が変わる。"],gameState:["{A}がリード：SBを1枚残して3+1の残り守備を優先しやすい。","{B}がビハインド：2トップのハイプレスとロングボールが増え、セカンドボールの争いが中心になる。"],profiles:["{A}の6番にプレス耐性がない、CBに運ぶ力がないと、3v2の+1は機能しにくい。","{B}のFWに空中戦の強さとスピードがあると、ロングボールと残り守備への圧力が増す。"]},sources:["cv-433","cv-442","cv-restdef","cv-counterpress","cv-highpress","cv-twoupfront","cv-4141","es-lavolpiana","sv-halfspace","forcher2023rest","peters2025","uefa-ucl-2223","deep-research"],scenes:[{id:"overview",tab:"overview",poss:null,title:"{A} vs {B}：噛み合わせ（基本配置）" {id:"m-cb-2v1",attacker:"A",phase:"buildup",scene:"ip-build",evidence:"I",title:"第1ライン2v1：CF1人の相手にはCBが運ぶ",premise:"{B}がミドルブロックで10番を{A}のCMの前に置き（4-4-1-1）、CF1人で{A}のCB2枚を見ている。",setup:"{A}の2CB vs {B}のCFで2v1。{A}のCM2枚の前には{B}の10番、背後にボランチ2枚。",phenomenon:"CFが片方のCBへ寄せると、逆のCBが空く。空いたCBが運ぶと、{B}はSHかボランチを前に出すしかない。",aim:"CBが運んで{B}のSHを引き出し、空いたSB→SHのラインへ。または縦関係の2トップへ縦パス。",counter:"10番が1列上がって4-4-2化し、CB2枚を2人で見る。SHが内側に絞ってCBの運ぶコースを消す。",readjust:"10番が上がったら{A}はCMを経由して前進する。FWの1人が降りれば中盤は3v2になる。",exception:"CBに運ぶ技術がないと2v1は使えず、ロングボールに頼ることになる。",sources:["cv-4231","cv-442","uefa-ucl-2223"]},{id:"m-channel",attacker:"A",phase:"wide",scene:"ip-direct",evidence:"I",title:"2トップの片方がチャネルへ流れ、SH＋SBで大外を攻める",premise:"{B}の2CBが{A}の2トップに固定され、{B}のSBが{A}のSHを見ている。",setup:"最終ライン中央は2v2。大外は{A}のSB＋SH vs {B}のSB＋SH。",phenomenon:"FWの1人がCBとSBの間（チャネル）へ流れると、{B}のCBが付いて行くか、SBが下がるかの判断が生じる。CBが付けば中央は1v1、SBが下がれば{A}のSHが空く。",aim:"チャネルで起点を作り、SHとSBが追い越して大外で2v1。逆のFWはファーへ。",counter:"ボランチの1人が最終ラインに落ちてチャネルを埋める。SHが帰陣してSBを助ける。",readjust:"ボランチが落ちた瞬間、{A}のCMが前向きでPA前へ入る。",exception:"{B}が守備時にボランチを落として5枚気味に守ると、チャネルは最初から閉じている。",sources:["cv-twoupfront","cv-442"]},{id:"m-direct",attacker:"A",phase:"progression",scene:"ip-direct",evidence:"I",title:"4-4-2化したプレスには、2トップへの直接球とセカンド回収",premise:"{B}が10番をCFの横へ上げて4-4-2化し、{A}のビルドアップを人で捕まえに来る。",setup:"{A}の後方は2CB＋2CM＋GK vs {B}のCF・10番・SH2枚・ボランチ2枚。最終ラインは{A}の2トップ vs {B}の2CBで2v2。",phenomenon:"人を捕まえるプレスでは後方の数的優位がGKだけになり、2トップへの長いボールの方が速い。最終ラインは同数なので、競り合いの後のこぼれ球で勝負が決まる。",aim:"1人が競り、もう1人が落としを拾うか背後へ。SHが内側に絞ってセカンドボールを拾う。",counter:"{B}は2CBの間隔を詰め、ボランチの1人が落下点の前に下がってセカンドを拾う。SBは絞って背後をカバーする。",readjust:"ボランチが下がったら、{A}はセカンドをCMで拾って10番の背後へ運ぶ。",exception:"{A}の2トップが空中戦で劣ると、この前進は単なるボールロストになる。",sources:["cv-twoupfront","cv-4231"]},{id:"m-pivot-free",attacker:"B",phase:"buildup",scene:"oop-build",evidence:"I",title:"ボランチへのコース：2トップが消せなければ、中盤の前でフリー",premise:"{A}の2トップが{B}のCB2枚へ外から寄せ、ボランチへのコースを背中で消せていない。",setup:"{B}の2CB＋ボランチ2枚（ボックス）vs {A}の2トップで4v2。{A}のCM2枚の背後には{B}の10番。",phenomenon:"ボランチの1人が2トップの背後で前を向く。{A}のCMが出れば背後の10番が空き、出なければボランチが運ぶ。",aim:"ボランチから10番への縦パス。または運んで{A}のSHを内側へ引き付けてから外のSBへ。",counter:"2トップが内側から外へ寄せてボランチを背中で消す（外へ誘導する）。CMは10番を基準に残り、SBへのパスをトリガーにSHが出る。",readjust:"{B}はボランチの1人をCBの間・横へ落として第1ラインを3枚にし、2トップの外側から運ぶ。",exception:"{A}がマンツーマン寄りでCMがボランチまで出る設計なら、論点は10番を誰が見るか（CBが前に出るか）に移る。",sources:["cv-442","cv-4231","cv-doublepivot"]},{id:"m-ten-between",attacker:"B",phase:"progression",scene:"oop-between",evidence:"I",title:"10番がCMの背後で受ける：2枚のCMは前と後ろを同時に見られない",premise:"{A}のCMがボランチへ前に出た、または{A}の2列の距離が開いている。",setup:"{B}の10番が{A}のCM2枚の背後、CBの前（ライン間）に立つ。{B}のSHが内側に入ると、ライン間に2〜3人。",phenomenon:"縦パスが10番に入ると、{A}はCBが前に出るか、CMが戻るかを迫られる。CBが出るとCFが背後へ走れる。",aim:"10番が前を向き、CFの裏抜けか、SHへの斜めのパス。",counter:"CMの片方は常に10番の前に残る（縦関係）。2トップの1人が下がってボランチを見る（4-4-1-1）。",readjust:"{B}は空いた外のSBを使って横に揺さぶり、2列のスライドを強制する。",exception:"{A}の2列がコンパクトでライン間が狭ければ、10番が受けても前を向けない。",sources:["cv-4231","cv-442"]},{id:"m-b-counter",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のロスト直後：10番の前進と、SHのSB裏へのラン",premise:"{A}が両SBを上げた2-4-4で攻め、中央でボールを失う。",setup:"{A}の残り守備は2CB＋2CM（2+2）。{B}はCF＋10番＋SH2枚の4人が前方にいる。",phenomenon:"{A}の後方は数では足りているが、上がったSBの背後は空いている。{B}の10番が前を向くと、SHがSBの背後へ斜めに走る。",aim:"10番からSBの背後へ走るSHへ。CFはCBの間で起点を作る。",counter:"CMの1人が10番にすぐ寄せて前を向かせない（遅らせる）。逆SBは絞ってCBの横に入り、3枚で守る。",readjust:"{A}は攻撃時に片SBを残し、3+2の残り守備にする。",exception:"{B}のSHが守備で深く戻っている（4-5-1）なら、カウンターの人数が足りない。",sources:["cv-restdef","cv-att-transitions","forcher2023rest"]},{id:"m-a-counter",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"奪った瞬間、2トップの1人が{B}のSBの背後へ",premise:"{B}がSBを高く上げ、ボランチ2枚を残して攻めているときに{A}が奪う。",setup:"{B}の残り守備は2CB＋ボランチ2枚（2+2）。{A}は2トップが前方に残っている。",phenomenon:"{B}のSBの背後は空いていて、2トップの1人がそこへ流れるとCBが外へ釣られる。もう1人は中央の起点になる。",aim:"1人目はSBの背後でボールを受け、2人目と逆SHがPAへ。中央はCBとボランチの間を使う。",counter:"ボランチの1人が最初のパスの出し手に寄せ、もう1人が中央の起点を消す。CBは無理に外へ出ず遅らせる。",readjust:"{A}のCMとSHが追い越して人数を加える。",exception:"{B}が両SBを同時に上げない（片側が残る）なら、背後のスペースは片側だけになる。",sources:["cv-twoupfront","cv-att-transitions","deep-research"]}],adjustments:[{id:"adj-4411",by:"A",scene:"adj-a-4411",title:"FWの1人をボランチ番に下げる（4-4-1-1）",trigger:"{B}のボランチが2トップの背後で前を向き続ける。",change:"FWの1人がボランチの1人をマークし、もう1人がCBへ寄せながら逆のボランチを背中で消す。",effect:"中央で前を向く選手は減るが、{B}のCBの1人が空く。運ばれると{A}のSHが前に出るしかない。",response:{by:"B",text:"フリーのCBが運んで{A}のSHを引き出し、背後のSBへ。"}},{id:"adj-drop",by:"B",scene:"adj-b-drop",title:"ボランチの1人をCBの間に落として第1ラインを3枚に",trigger:"{A}の2トップが内側から寄せて、ボランチを背中で消してくる。",change:"ボランチの1人がCBの間に降り、両SBが高い位置へ。",effect:"第1ラインは3v2。外のCBが2トップの外側から運べる。代わりに中盤中央は残りのボランチと10番の2人になる。",response:{by:"A",text:"SHが前に出て外のCBへ寄せ、{A}のSBがSHの背後へスライド。CM2枚は中央の2人を見る。"}},{id:"adj-press442",by:"B",scene:"ip-direct",title:"10番を1列上げて4-4-2で人を捕まえる",trigger:"{A}のCBが2v1で運び続ける。",change:"10番がCFの横へ上がってCB2枚を2人で見る。SHが{A}のSB、ボランチが{A}のCMを見る。",effect:"後方のビルドアップは同数になるが、{B}の最終ラインは{A}の2トップに対して2v2になる。",response:{by:"A",text:"2トップへ早めに蹴り、SHを内側に絞らせてセカンドボールを拾う。"}},{id:"adj-sh-narrow",by:"A",title:"逆サイドのSHを絞らせて10番の周りを3人で囲む",trigger:"{B}の10番がCMの背後で受けて前を向く。",change:"ボールと逆のSHが中央へ絞り、CM2枚＋SHで10番の周囲を埋める。",effect:"中央は閉じるが、逆サイドの大外で{B}のSBが空く。",response:{by:"B",text:"ボランチから逆サイドのSBへ大きく展開し、{A}の2列を横に走らせる。"}}],setPieces:[{title:"{A}の攻撃CK",text:"{A}は2CB＋2トップの4人を空中戦に送れる。{B}がCF1人だけを前線に残すなら、{A}は2CBのうち1人とCM1人を残す判断が成り立つ。",evidence:"I"},{title:"{B}の攻撃CK",text:"{B}はCF＋2CB（＋10番）が空中戦の候補。{A}が2トップの1人を前線に残すと、{B}は2CB＋ボランチ1人を残す必要があり、PA内の人数が減る。",evidence:"I"},{title:"セカンドボール",text:"PA外の回収地点は{A}のCM2枚 vs {B}のボランチ2枚の同数。ここで負けると2次攻撃が続く。",evidence:"I"}],validity:{assumptions:["{A}はゾーン基準の4-4-2で2列を保ち、2トップは横並びでCBとボランチへのコースを見る。","{B}は保持で2CB＋2ボランチのボックスを作り、10番がライン間に立つ。","{B}の非保持は10番が上下する4-4-1-1／4-4-2。"],exceptions:["{B}が保持でボランチの1人を上げて中盤3枚（4-3-3化）にするなら、中盤の構図は2v3のまま、受け手の位置が変わる。","{A}がマンツーマン寄りで中盤を捕まえるなら、背後の2v2（{A}の2CB vs {B}のCF＋10番）が主題になる。","{B}がSBを上げず4枚を残して攻めるなら、トランジションでの{A}の2トップの狙いは成立しにくい。"],gameState:["{A}がリード：4-4-1-1で低く構え、2トップの1人を残してカウンターの出口にする。","{B}がビハインド：ボランチの1人を上げて中盤3枚にし、両SBを同時に上げてリスクを取る。"],profiles:["{B}の10番が、背中にCMを背負っても前を向けるタイプか。","{A}の2トップに空中戦の強い選手がいるか。","{A}のCMに、前に出た後に戻れる守備範囲があるか。"]},sources:["cv-442","cv-4231","cv-doublepivot","cv-twoupfront","cv-restdef","cv-att-transitions","forcher2023 ぶ。",aim:"SBが運んで8番を外へ引き出し、空いたCBの間へ{B}の8番が走る。またはWGの1v1。",counter:"8番がSBへスライドし、WBは外のWGを見る（中盤3枚の横移動）。2トップの1人が{B}の6番を消す。",readjust:"{B}は8番がスライドした瞬間、逆サイドへ大きく展開して中盤3枚の横移動を間に合わなくする。",exception:"{A}の8番の横移動が速く、外CBがWGとの1v1に強ければ、大外の数的不利は表面化しにくい。",sources:["cv-inzaghi","cv-wingbacks","cv-433","it-uu-352"]},{id:"m-six-free",attacker:"B",phase:"buildup",scene:"oop-build",evidence:"I",title:"6番が2トップの背後で+1になる",premise:"{A}の2トップが{B}のCB2枚へ寄せ、{B}の6番を消す選手がいない。",setup:"{B}の2CB＋6番 vs {A}の2トップで3v2。{A}の6番が前に出れば{B}の8番の誰かが空く。",phenomenon:"6番が前を向くと、{A}は8番をジャンプさせるか、6番を前に出すしかない。どちらかの背後が空く。",aim:"6番から大外のWGへの対角パス。前に出た{A}のWBの背後を突く。",counter:"2トップを縦関係にして1人が6番を消す。ボールが外へ出たら、WBと近い8番がジャンプしてサイドに閉じ込める。",readjust:"{B}はSBを内側に入れて、6番の横に2人目のピボットを作る。",exception:"{A}が最初から2トップの1人を6番番にする（5-3-1-1）なら、論点は{B}のCBの持ち運びに移る。",sources:["cv-inzaghi","cv-433"]},{id:"m-wb-behind",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のWBが高い位置で失った直後：WBの背後",premise:"{A}のWBが高い位置でボールを失い、外CBも高い位置にいる。",setup:"{A}の残り守備は3CB＋6番（3+1）。ただし失った側の大外にはWBがいない。",phenomenon:"{B}のWGはWBの背後に残っている。最初のパスが外へ出ると、外CBが1人でWGを止めることになる。",aim:"WGがWBの背後で受け、CFとともに3CBを横に広げる。逆WGはファーへ。",counter:"失った瞬間に近い8番とWBで即時奪回。外CBは無理に出ずに遅らせ、中央CBがスライド。逆WBは最終ラインまで戻る。",readjust:"{A}は片方のWBだけを高く上げ（非対称）、失った側の背後のリスクを減らす。",exception:"{B}のWGが守備で深く戻っているなら、カウンターの出口がない。",sources:["cv-wingbacks","cv-restdef","cv-counterpress","forcher2023rest"]},{id:"m-sb-behind",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"奪った瞬間、2トップの1人が{B}のSBの背後へ",premise:"{B}が両SBを高く上げて攻めている最中に、{A}が中央で奪う。",setup:"{B}の残り守備は2CB＋6番。{A}の2トップが前に残っている。",phenomenon:"2トップの1人がSBの背後へ流れると、{B}のCBが外へ釣られ、中央は1v1になる。6番を越えれば2v2。",aim:"8番からもう1人のFWへ当て、背後へ流れたFWへ。逆WBと8番がPAへ追い越す。",counter:"{B}の6番が最初のパスの出し手に寄せ、CBは遅らせる。SBは全力で戻る。",readjust:"{A}の8番とWBが追い越して人数を増やす。",exception:"{B}が片SBを残して攻めているなら、使えるのは逆側の背後だけ。",sources:["cv-twoupfront","cv-att-transitions","deep-research"]}],adjustments:[{id:"adj-asym",by:"A",scene:"adj-a-asym",title:"WBを非対称に：片側だけ高くする",trigger:"WBの背後へのカウンターが続く。{B}のWGが2人とも前に残っている。",change:"片方の title:"10番が6番の脇で受ける",premise:"{B}の8番が{A}のボランチへ前に出て、{B}の6番が1人でライン間を守っている。",setup:"{A}の10番＋内側に入ったSH vs {B}の6番。ライン間で2v1になる。",phenomenon:"10番が6番の真横（ハーフスペース）へずれると、6番は付いて行くか中央に残るかを迫られる。付いて行けば中央が、残れば10番が空く。",aim:"10番が前を向き、CFへの縦パスかSHへの斜めのパス。CFはCBの間で受ける。",counter:"戻った8番が6番の脇を埋め、2人で6番の周りを守る。CBが前に出て10番を潰す。",readjust:"CBが前に出たら、CFがその背後へ走る。",exception:"{B}の8番がジャンプせず中盤ラインに残るなら、6番の脇は空かない。",sources:["cv-4231","cv-4141"]},{id:"m-sh-inside",attacker:"A",phase:"wide",scene:"ip-ten",evidence:"I",title:"SHが内側、SBが大外：{B}のSHはどちらを見るか",premise:"{A}のSHが内側（ハーフスペース）に入り、SBが大外の高い位置を取る。",setup:"大外からハーフスペースは{A}のSH＋SB vs {B}のSH＋SBで2v2。中央寄りに10番もいる。",phenomenon:"{B}のSHがSBに付いて下がると中盤ラインが4枚から3枚になり、6番の脇が広がる。付かなければ{B}のSBが大外で1v2。",aim:"SHを下げさせて中盤を薄くするか、大外の2v1で崩す。",counter:"{B}のSHがSBに付いて下がり、8番が6番の脇まで戻る（4-5-1の低いブロック）。",readjust:"{A}は低く構えた{B}の前で、ボランチがミドルレンジの選択肢（ミドルシュート、対角のパス）を使う。",exception:"{B}のSHの帰陣が速く、8番のスライドも間に合うなら、どちらも空かない。",sources:["cv-4141","cv-4231"]},{id:"m-six-reference",attacker:"B",phase:"buildup",scene:"oop-build",evidence:"I",title:"10番が6番を放置すると、6番がビルドアップの基準点になる",premise:"{A}が4-4-2化してCF＋10番で{B}のCB2枚へ寄せ、{B}の6番を見る選手がいない。",setup:"{B}の2CB＋6番 vs {A}のCF＋10番で3v2。{A}のボランチ2枚は{B}の8番2枚を見ている。",phenomenon:"6番が2人の背後で前を向くと、{A}のボランチが前に出るしかなく、その背後で{B}の8番が空く。",aim:"6番から8番（ボランチの背後）、そこからSHやCFへ。",counter:"10番はCBへ出ずに6番を背中で消し、CFが1人でCB2枚を外へ誘導する（4-4-1-1）。",readjust:"{B}はCBが運ぶ（第1ラインは2v1）。または8番が降りて6番の横に立つ。",exception:"{A}のボランチが前に出ても、CBが8番に付いて行ける（マンツーマン寄り）なら、6番の前進は止められる。",sources:["cv-4231","cv-4141","deep-research"]},{id:"m-eights-run",attacker:"B",phase:"progression",scene:"oop-eight",evidence:"I",title:"8番2枚がボランチの背後へ走る",premise:"{B}が長い保持で4-3-3化し、8番2枚がハーフスペースに立つ。{A}の10番は戻っていない。",setup:"{B}の6番＋8番2枚 vs {A}のボランチ2枚で3v2。",phenomenon:"8番がボランチの背後（CBの前）へ走ると、ボランチは付いて下がるか、6番を見るかで迷う。付いて下がれば6番が空き、付かなければ8番がライン間で受ける。",aim:"8番がライン間で受け、SHやCFとの連係でPAへ。",counter:"10番が{B}の6番まで戻り（4-4-1-1）、ボランチは8番に付いて下がる。逆SHが絞る。",readjust:"{B}はSHを大外の高い位置に固定し、{A}のSBを外に引き付ける。",exception:"{A}のボランチの片方がCBの前に残る運用なら、背後へのランは届かない。",sources:["cv-4141","cv-4231","cv-doub p-switch",at:[60,70]},{text:"相手2トップへのロングボールのセカンドを6番が拾えているか",look:"相手2トップの落下点の前",why:"拾えなければ相手の中盤3枚が前を向き、WBが上がる時間を与える。",scene:"ip-direct",at:[40,72]}]},superiority:[{kind:"numerical",zone:"{A}の2トップ vs {B}の2CB",a:2,b:2,text:"最終ライン中央は同数。{B}の6番が下がれば2v3。",when:"{B}のSBが高い位置にいるとき"},{kind:"numerical",zone:"大外（片側）",a:1,b:2,text:"{A}のWB vs {B}のWG＋SB。外CBか8番の助けが必要。",when:"{B}のSBが攻撃参加したとき"},{kind:"numerical",zone:"PA幅の守備",a:5,b:3,text:"{A}の5バック vs {B}のCF＋2WG。",when:"{A}が5-3-2で構えているとき"},{kind:"numerical",zone:"中盤",a:3,b:3,text:"6番＋8番2枚同士の同数。ただし{A}の3枚は横幅全体を守る。",when:"常に（公称配置）"},{kind:"positional",zone:"PA前の中央",holder:"A",text:"5バック＋中盤3枚の2列でPA前の中央を埋め、ライン間で前を向かせない。",when:"{A}が低い位置で構えているとき"},{kind:"positional",zone:"中盤3枚の外側",holder:"B",text:"5-3-2の中盤3枚の外側（大外の中盤の高さ）は構造的に空きやすい。",when:"{A}の中盤がボールサイドへスライドしたとき"},{kind:"qualitative",zone:"2トップの収める力",holder:"A",text:"空中戦とボールを収める力のある2トップなら、直接球で{B}のプレスを一度に越えられる。",when:"2トップの個の質が高い場合のみ"},{kind:"qualitative",zone:"WGの1v1",holder:"B",text:"{B}のWGが外CBとの1v1に勝てれば、5バックの外側から崩せる。",when:"WGの個の質が高い場合のみ"}],freemen:[{who:"{B}のSB",when:"{A}のWBがWGを見て前に出ないとき",scene:"oop-wide"},{who:"{B}の6番",when:"{A}の2トップが{B}のCB2枚へ寄せたとき（対角の出どころ）",scene:"oop-switch"},{who:"{A}のWB",when:"{B}のWGが{A}の外CBへ寄せたとき",scene:"ip-build"},{who:"{A}の8番（セカンド）",when:"2トップへの直接球に競り勝ったとき",scene:"ip-direct"}],interplay:[{builder:"A",build:"3CB＋6（＋GK）",press:"CF＋2WG（＋8番）",a:4,b:3,key:"WBが低いので、第1ラインの+1は外CBの持ち運びかWBへの展開で使う。WGが外CBへ出ればWBが、WBを消せば外CBが空く。",escape:"2トップへの直接球／外CBの持ち運び／6番の降り",scene:"ip-build"},{builder:"B",build:"2CB＋6（＋GK）",press:"2トップ（外切り）",a:2,b:3,key:"{A}の2トップは高い位置から追わず、外へ誘導してサイドで閉じ込める。{B}の6番を消せるかが前提。",escape:"6番からの対角／6番落とし（3-2-5）／SBのインバート",scene:"oop-switch"}],restDefence:{A:{shape:"3CB＋6番（3+1）",vs:"{B}のCF＋2WG",a:4,b:3,note:"WBが上がりかけの時間帯は、大外を外CB1人で見ることになる。"},B:{shape:"2CB＋6番（2+1）",vs:"{A}の2トップ",a:2,b:3,note:"{A}のWBは低い位置からなので、カウンター初期の幅は小さい。中央の2トップを囲めるか。"}},duels:[{a:"WB",b:"WG・SB",text:"WBがSBへ出るか、WGを見るか。5バックを崩さずに受け渡せるか。",scene:"oop-wide"},{a:"外CB",b:"WG",text:"WBが出た背後で外CBがWGに付いて行くか。CBの間のチャネル。",scene:"oop-wide"},{a:"8番",b:"SB・8番",text:"中盤3枚の横移動。外へスライドした8番の背後のハーフスペース。",scene:"oop-switch"},{a:"2トップ",b:"2CB・6番",text:"直接球の競り合いと落とし。{B}の6番が落下点の前に入れるか。",scene:"ip-direct"},{a:"6番",b:"CF",text:"{A}の6番が{B}のCFの降りる動きを見るか、セカンドを拾いに出るか。",scene:"tr-loss"}],mechanisms:[{id:"m-direct-second",attacker:"A",phase:"progression",scene:"ip-direct",evidence:"I",title:"2トップへの直接球と、中盤3枚のセカンド回収",premise:"{B}が前線3枚＋8番で高い位置から寄せ、{A}のWBはまだ低い位置にいる。",setup:"{A}の2トップ vs {B}の2CBで2v2（{B}の6番が下がれば2v3）。セカンド地点は{A}の中盤3枚 vs {B}の6番＋8番。",phenomenon:"足元でつなぐ人数が足りない分、2トップへの長いボールで{B}のプレスを一度に越える。落としを中盤3枚が前向きで拾えれば、{B}の前線3枚は背後に置き去りになる。",aim:"1人が競って落とし、8番が拾ってWBが上がる時間を作る（3-5-2化）。",counter:"{B}の6番がCBの前でセカンドを拾い、SBは絞ってCBの背後をカバーする。",readjust:"{A}はFWの1人を少し下げて縦関係にし、落としの角度を作る。",exception:"2トップが空中戦で劣る場合、ロングボールは{B}にボールを返すだけになる。",sources:["cv-twoupfront","cv-352-key","deep-research"]},{id:"m-wb-time",attacker:"A",phase:"buildup",scene:"ip-build",evidence:"I",title:"WBが上がる時間を作れるか（5-3-2→3-5-2）",premise:"{A}が後方で保持し、WBが最終ラインの高さから攻撃参加を始める。",setup:"{A}の3CB＋6番（＋GK）vs {B}のCF＋2WGで4v3。WBが上がる前は、大外に{A}の選手がいない。",phenomenon:"{B}のWGが外CBへ寄せると、背後でWBが空く。WGがWBを見れば外CBが運べる。WBが上がりきるまでの数秒を外CBが持ちこたえられるかで、前進の形が決まる。",aim:"外CBがWGを引きつけてから、上がったWBへ。WBが高い位置を取れれば3-5-2の攻撃に移れる。",counter:"WGは外から内へ寄せてWBへのコースを消し、SBがWBへ縦にスライドする。",readjust:"6番がCBの横へ降り、外CBを1列前へ押し出す（外CBが幅を取る）。",exception:"WBにスピードがなければ、3-5-2化する前に{B}が守備を整えてしまう。",sources:["cv-352-key","cv-wingbacks","it-uu-difesa3"]},{id:"m-wb-choice",attacker:"B",phase:"wide",scene:"oop-wide",evidence:"I",title:"WBは誰へ出るか：SBか、WGか",premise:"{A}が5-3-2のミドル〜ローブロックで守り、{B}がWG＋SBで大外に2人を置く。",setup:"大外は{B}のWG＋SB vs {A}のWB（＋外CB）。中盤3枚は横幅68mを3人で守る。",phenomenon:"WBがSBへ出ると、背後で外CBがWGへ出ることになり、外CBと中央CBの間（チャネル）が空く。WBが出なければ、{B}のSBがフリーで運んで{A}の8番を引き出す。",aim:"チャネルへ8番かCFが走る。またはSBが運んでクロス、ハーフスペースへ8番が入る。",counter:"8番が外へスライドしてSBを見て、WBはWGを見る（5バックを崩さない）。逆サイドの8番と6番は中央へ寄る。",readjust:"{B}は8番がスライドした瞬間に、逆サイドの大外へ大きく展開する。",exception:"{A}の8番の横移動が速く、外CBがWGとの1v1に強いなら、大外の数的不利は表面化しにくい。",sources:["cv-inzaghi","cv-wingbacks","cv-433","pt-lance-linha5"]},{id:"m-switch",attacker:"B",phase:"progression",scene:"oop-switch",evidence:"I",title:"大きなサイドチェンジで中盤3枚を走らせる",premise:"{A}の中盤3枚と2トップがボールサイドへスライドしている。",setup:"逆サイドの大外は{B}のWG＋SB vs {A}のWB。中盤3枚の逆側は空いている。",phenomenon:"1本の対角のパスに、{A}の中盤3枚は逆側まで横移動しきれない。WBは前に出ればチャネル、出なければSBが空く。",aim:"6番やCBからの対角のパスで、逆サイドに1v1か2v1を作る。",counter:"2トップの1人が{B}の6番を消して、対角の出どころを止める。逆WBは高さを保ち、WGを前で受ける。",readjust:"{B}はSBをインバートさせ、対角の出し手を2人にする。",exception:"{A}が5-4-1でFWの1人を中盤の脇に下げているなら、逆サイドも埋まる。",sources:["cv-inzaghi","cv-433"]},{id:"m-second-lost",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のロングボールのセカンドを{B}が拾った直後：WBが上がりかけた背後",premise:"{A}が2トップへ蹴り、WBが3-5-2化しようと上がり始めた瞬間に、{B}がセカンドボールを拾う。",setup:"{A}の後方は3CB＋6番（3+1）、WBは中途半端な高さ。{B}はWG2枚が大外の高い位置に残っている。",phenomenon:"WBが戻りきる前に、{B}のWGへ斜めのパスが出る。外CBがWGへ出ると、CBの間が空く。",aim:"WGからCFの背後へのラン、または逆WGのファー。",counter:"近い8番がセカンドを拾った{B}の選手へ即時に寄せ、WBは全力で戻る。外CBは遅らせる。",readjust:"{A}は蹴る前にWBの片方だけを上げ、もう片方は残す。",exception:"{A}のセカンド回収が安定していれば、この状況自体が起きにくい。",sources:["cv-wingbacks","cv-counterpress","forcher2023rest"]},{id:"m-outlet-2",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"奪った瞬間の出口は2トップ、幅はWBの長いラン",premise:"{A}が5-3-2の低いブロックで奪い、{B}は両SBが高い位置にいる。",setup:"{A}の2トップ vs {B}の2CB＋6番（2v3）。{A}のWBはPA付近の低い位置から走り出す。",phenomenon:"2トップへの縦パスは通りやすいが、カウンター初期の幅がなく、{B}の6番とCBに中央で囲まれやすい。WBが追い越すまでの時間を2トップが作れるか。",aim:"2トップの1人がボールを収め、もう1人がSBの背後へ。WBが大外を長い距離走って追い越す。",counter:"{B}の6番が縦パスの受け手に背後から寄せ、CBは前に出て潰す。SBは全力で戻る。",readjust:"{A}はWBの片方を守備時から少し高く置き、カウンターの幅役にする。",exception:"2トップにボールを収める力がなければ、カウンターは単発で終わる。",sources:["cv-twoupfront","cv-att-transitions","deep-research"]}],adjustments:[{id:"adj-541",by:"A",scene:"adj-a-541",title:"FWの1人をSHの位置へ下げて5-4-1",trigger:"大外で2v1を作られ続ける。",change:"ボールサイドのFWが中盤の脇まで下がり、中盤を4枚にする。",effect:"大外の数的不利は解消するが、カウンターの出口がFW1人になり、クリア後に押し込まれ続けやすい。",response:{by:"B",text:"{B}は2CB＋6番で前に残ったFW1人を囲み、奪い返したら再び押し込む。"}},{id:"adj-3412",by:"A",title:"WBを上げて3-4-1-2に近づける（追う展開）",trigger:"ビハインドで、攻撃の人数が足りない。",change:"WBを高い位置に固定し、8番の1人を2トップの下へ上げる。",effect:"攻撃の人数は増えるが、WBの背後と3CBの横が空き、カウンターに弱くなる。",response:{by:"B",text:"WGをWBの背後に残し、奪った瞬間に外CBとの1v1を作る。"}},{id:"adj-325",by:"B",scene:"adj-b-325",title:"6番をCBの間に落として3-2-5",trigger:"{A}の2トップに6番を消され、ビルドアップが外へ閉じ込められる。",change:"6番がCBの間に降り、8番2枚がその前でピボット、両SBが高い位置で幅を取る。",effect:"第1ラインは3v2で外のCBが運べる。前線は5枚になり、{A}の5バックと同数になる。",response:{by:"A",text:"WBは前に出ずに5バックを保ち、2トップの1人が下がって中盤を4枚にする（5-4-1）。"}},{id:"adj-wg-in",by:"B",title:"WGを内側に絞らせ、大外はSBに任せる",trigger:"{A}のWBと8番の受け渡しで大外が止められる。",change:"WGがハーフスペースへ入り、SBが大外の高い位置を取る。",effect:"{A}のWBの基準（誰を見るか）がずれ、外CBはWGに付いて中へ、WBはSBに出て背後を空けることになる。",response:{by:"A",text:"8番がハーフスペースまで下がってWGを挟み、WBはSBを見る。"}}],setPieces:[{title:"{A}の守備CK",text:"5バック＋中盤3枚でPA内の人数は確保しやすいが、クリア後の回収地点が低くなりやすい。2トップの1人を前線に残すかが分かれ目。",evidence:"I"},{title:"{A}の攻撃CK",text:"3CB＋2トップで空中戦の要員が多い。{B}がWG2枚を前線に残すなら、{A}はWBと6番を残す計算になる。",evidence:"I"},{title:"セカンドボール",text:"PA外の回収地点は{A}の中盤3枚 vs {B}の6番＋8番2枚の同数。",evidence:"I"}],validity:{assumptions:["{A}は非保持で5-3-2（WBは最終ライン）、保持ではWBを上げて3-5-2化を狙う。","{B}はSBを上げる4-3-3で、前線3枚からプレスする。"],exceptions:["{A}が5-4-1を基本にする（FWの1人が中盤の脇）なら、大外の2v1は消えるが、カウンターの出口が1人になる。","{B}がWGを内側に置いて中央を厚くするなら、5バックの外側ではなく中央の受け渡しが論点になる。","{A}が高い位置からマンツーマンで追う設計なら、5-3-2の論点（大外とスライド）は小さくなり、背後の1v1が中心になる。"],gameState:["{A}がリード：5-4-1でPAを固め、2トップの1人だけを残す。クリア後の回収地点が低くなる。","{A}がビハインド：WBを高く上げて3-4-1-2や3-4-3に近づけ、WBの背後のリスクを取る。"],profiles:["WBに、5バックの守備と長い距離の攻撃参加を両立する走力があるか。","2トップに、ボールを収めて時間を作る力があるか。","中盤3枚に、横幅全体を守る横移動の量があるか。"]},sources:["cv-352-key","cv-wingbacks","cv-twoupfront","cv-inzaghi","cv-433","cv-counterpress","cv-att-transitions","it-uu-difesa3","pt-lance-linha5","forcher2023rest","deep-research"],scenes:[{id:"overview",tab:"overview",poss:null,title:"{A} vs {B}：噛み合わせ（基本配置）",short:"基本配置",caption:"{A}の5バックの外側では、WBが{B}のWGとSBの2人に挟まれる（1v2）。中盤は3v3だが、{A}の3枚は横幅全体を守る。最前線は{A}の2トップ vs {B}の2CB。",teams:{A:{from:"base"},B:{from:"base"}},overlays:[{t:"mark",a:"A:LWB",b:"B:RW"},{t:"mark",a:"A:LWB",b:"B:RB"},{t:"mark",a:"A:RWB",b:"B:LW"},{t:"mark",a:"A:RWB",b:"B:LB"},{t:"mark",a:"A:LCM",b:"B:RCM"},{t:"mark e:"ボックスのビルドアップ：8番がジャンプした背後で10番",premise:"{A}がCF＋8番で{B}の2CB＋ボランチ2枚へ寄せ、8番の1枚がボランチへジャンプする。",setup:"{B}の2CB＋ボランチ2枚（＋GK）vs {A}のCF＋8番2枚。{A}の6番は{B}の10番を見ている。",phenomenon:"8番がボランチへ出ると、その背後のスペースへ10番が降りて受ける。6番が付いて行くと中央が空く。",aim:"ボランチから8番の背後の10番へ。10番が前を向けばSHやCFへ。",counter:"8番は外側からボランチへ寄せて10番へのコースを背中で消す。6番は10番を前に向かせない位置を取る。",readjust:"{B}はGKを使って逆サイドのCBへ出し、プレスの外側から運ぶ。",exception:"{A}がCFだけで中央を消し、8番を出さない（4-5-1）なら、{B}のボランチは前向きでも10番へのコースは狭い。",sources:["cv-4231","cv-433","cv-doublepivot"]},{id:"m-b-counter",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のロスト直後：10番が前を向き、SHがSBの背後へ",premise:"{A}が2-3-5で攻め、両SBが高い位置にいる状態で中央のボールを失う。",setup:"{A}の残り守備は2CB＋6番。{B}はCF＋10番＋SHが前方にいて、3v3になる。",phenomenon:"10番が6番の前で前を向くと、6番は10番とCFの両方を見ることになる。SHは上がったSBの背後へ斜めに走る。",aim:"10番からSBの背後のSHへ。CFはCBの間で起点になる。",counter:"ボール周辺の8番で即時奪回し、6番は出ずに縦パスを消す。逆SBは絞って3枚で守る。",readjust:"{A}は片SBを残して3+1にする。",exception:"{B}のSHが4-4-1-1で深く戻っていると、カウンターの人数が足りない。",sources:["cv-restdef","cv-att-transitions","forcher2023rest"]},{id:"m-a-counter",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"奪った瞬間、WGがSBの背後へ：ボランチ2枚の外側",premise:"{B}がSBを高く上げて攻め、{A}が4-1-4-1のブロックで奪う。",setup:"{B}の残り守備は2CB＋ボランチ2枚（2+2）で、{A}のWG・CF・WGに対して数は足りている。",phenomenon:"ボランチ2枚は中央を守るため、大外に残った{A}のWGは{B}のSBの背後で1v1になりやすい。",aim:"8番からWGへ外に出し、WGが運ぶ間にCFと逆WGがPAへ入る。",counter:"ボランチの1枚が最初のパスの出し手へ寄せ、CBは外へ出ずに遅らせる。SBは全力で戻る。",readjust:"{A}の8番が追い越し、ボランチの外側で数的優位を作る。",exception:"{B}が片SBを残して攻めているなら、背後は片側だけ。",sources:["cv-433","cv-doublepivot","cv-att-transitions"]}],adjustments:[{id:"adj-442",by:"B",scene:"adj-b-442",title:"10番を1列上げて4-4-2でCBへ",trigger:"{A}のCBが2v1で運び続ける。",change:"10番がCFの横へ上がり、CB2枚を2人で見る。ボランチは{A}の8番を見る。",effect:"CBは運びにくくなるが、2人の背後で{A}の6番が空く。",response:{by:"A",text:"CBから6番へ縦パスを入れ、6番が前を向いて8番やWGへ展開する。"}},{id:"adj-drop6",by:"A",scene:"adj-a-drop",title:"6番をCBの間に落として3枚化",trigger:"{B}がCF＋10番の2人で{A}のCB2枚へ寄せてくる。",change:"6番がCBの間に降り、両SBが上がる。8番2枚が中盤の底を受け持つ。",effect:"第1ラインは3v2になり外のCBが運べる。中盤中央は8番2枚 vs ボランチ2枚＋10番になる。",response:{by:"B",text:"10番は降りて中盤を か。",scene:"overview"}],mechanisms:[{id:"m-firstline",attacker:"A",phase:"buildup",scene:"ip-build",evidence:"I",title:"CF1人の脇から運び、出てきた8番の背後へ",premise:"{B}が4-1-4-1で構え、CFが{A}の6番を背中で消しながら片方のCBへ寄せる。",setup:"{A}の2CB＋6番 vs {B}のCFで3v1。{B}の8番は{A}の8番を見ている。",phenomenon:"逆のCBが運ぶと、{B}は8番を前に出すしかない。出た8番の背後で{A}の8番が空く。",aim:"CBから8番へ縦パス。8番が前を向き、{B}の6番の脇へ運ぶかWGへ展開する。",counter:"{B}の8番は外側から寄せて、CBから8番へのコースを背中で消す。6番は1列上がって8番を前に向かせない。",readjust:"{A}は6番がCBの横へ降り、3枚で運ぶ。8番2枚は{B}の8番の背後に立ち続ける。",exception:"CBに運ぶ力がなければ、3v1は横パスで終わり、{B}は中盤4枚を崩さずに待てる。",sources:["cv-433","cv-4141","es-lavolpiana"]},{id:"m-pockets",attacker:"A",phase:"progression",scene:"ip-prog",evidence:"I",title:"8番2枚が6番の両脇に立つ",premise:"{A}が2-3-5で押し込み、8番2枚が{B}の中盤4枚の背後（6番の左右）に立つ。",setup:"{B}の6番1人 vs {A}の8番2枚で1v2。{B}の中盤4枚は{A}の6番とSBを見ている。",phenomenon:"6番が片方へ出ると逆の脇が空く。CBが前に出て潰すと、CBの間にCFが走るスペースができる。",aim:"中盤4枚の間を通す縦パスで8番が前を向き、CFの裏抜けかWGとの大外の2対1へ。",counter:"中盤4枚の間隔を詰めて縦パスのコースを消す。脇に入った8番にはCBが前で潰し、SBが絞る。",readjust:"{A}はCBが前に出た瞬間、CFがその背後へ走る。逆WGも内側へ入ってCBの間を狙う。",exception:"{B}の8番が下がって6番の横に並ぶ（2ボランチ化）なら、脇のスペースは消える。",sources:["cv-4141","cv-451","sv-halfspace"]},{id:"m-front5",attacker:"A",phase:"final",scene:"ip-prog",evidence:"I",title:"前線5枚で、{B}のSHを最終ラインへ引き込む",premise:"{A}がSBを上げて2-3-5になり、WGが大外いっぱいに立つ。",setup:"{A}の前線5枚 vs {B}の4バック＋6番。{B}のSHが戻らなければ、大外のWGは{B}のSBと1v1。",phenomenon:"{B}のSHがWGに付いて最終ラインまで下がると、6バック気味になり、中盤の人数が減る。",aim:"{B}のSHを押し下げてカウンターの出口を消し、PA手前で{A}の6番とSBが前を向く。",counter:"{B}はSHを中盤に残し、SBとCBのスライドで大外を守る。奪った瞬間にSHが前へ出られる位置を保つ。",readjust:"{A}はWGと8番が大外でポジションを入れ替え、SBの背後を2人で狙う。",exception:"{B}のSBが大外のWGに1人で勝てるなら、SHを下げる必要はない。",sources:["cv-433","cv-4141","cv-lowblock"]},{id:"m-b-wide",attacker:"B",phase:"wide",scene:"oop-wide",evidence:"I",title:"WGが高く残った大外で、SB＋SHの2v1",premise:"{A}がWGを高い位置に残して守り、{B}のSBに付いて戻らない。",setup:"大外は{B}のSB＋SH vs {A}のSBで2v1。{A}の8番は中央の{B}の8番を見ている。",phenomenon:"{B}のSBが運ぶと、{A}のSBはSHとSBのどちらに出るかを迫られる。8番がスライドすれば中央が薄くなる。",aim:"SBが運んでSHと2対1を作り、SBの背後かPA手前へ。",counter:"{A}の8番が外へスライドしてSBに寄せ、6番が中央へずれる。WGは戻りながら背後からSBを挟む。",readjust:"{B}は8番がハーフスペースへ走り、スライドした{A}の8番の背後を使う。",exception:"{A}のWGが常にSBに付いて戻る（4-1-4-1で守る）なら、大外の2v1は生まれない。",sources:["cv-433","cv-4141","cv-wingbacks"]},{id:"m-b-sb-outlet",attacker:"B",phase:"buildup",scene:"oop-build",evidence:"I",title:"4-3-3のプレスで空くSBから、8番の背後へ",premise:"{A}が4-3-3で前から寄せ、WGが{B}のCBへ、CFが{B}の6番を見る。",setup:"{B}のGK＋2CB＋6番 vs {A}の前線3枚で4v3。{B}のSBが空きやすい。",phenomenon:"SBへパスが出ると、{A}の8番が出るかSBが出るかを迫られる。8番が出れば、その背後で{B}の8番が空く。",aim:"SBから8番へ。8番が前を向けば、{A}の6番1人の前で数的優位を作れる。",counter:"{A}のWGが外から内へ曲線で寄せ、CBからSBへのコースを背中で消す。6番は{B}の8番へ前に出る。",readjust:"{B}は8番の1枚がCBとSBの間に降り、後方を3枚にしてWGの外側から運ぶ。",exception:"{A}がSBまで前に出してマンツーマンで嵌めるなら、{B}はGKからCFへの長いボールが主な出口になる。",sources:["cv-highpress","cv-433","cv-4141"]},{id:"m-b-counter",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のロスト直後：CFが収め、SHが高いSBの背後へ",premise:"{A}が2-3-5で攻め、両SBが高い位置にいる状態で中央のボールを失う。",setup:"{A}の残り守備は2CB＋6番。{B}の前線はCF1人で、SHは深い位置から走り出す。",phenomenon:"CFが6番の前で収めると、{A}のCBはCFへ出るか下がるかを迫られる。その間にSHが高いSBの背後へ長い距離を走る。",aim:"CFが落として8番が前を向き、SBの背後のSHへ。",counter:"{A}は前線5枚と8番で即時奪回し、6番はCFへの縦パスを消す。CBは前に出てCFに前を向かせない。",readjust:"{A}は片SBを残して3+1にし、SHの走るスペースを先に埋める。",exception:"{B}のCFが孤立して収められなければ、{A}は即時奪回で押し込み続けられる。",sources:["cv-restdef","cv-att-transitions","forcher2023rest"]},{id:"m-a-counter",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"奪った瞬間、高く残ったWGがSBの背後へ",premise:"{B}がSBを上げて攻め、{A}がWGを高めに残したまま奪う。",setup:"{B}の残り守備は2CB＋6番（2+1）。{A}のCF＋2WGで3v3。",phenomenon:"{B}の6番は中央を守るため、大外に残った{A}のWGはSBの背後で1v1になりやすい。",aim:"8番からWGへ外に出し、WGが運ぶ間にCFと逆WGがPAへ入る。",counter:"{B}の6番が最初のパスの出し手へ寄せ、CBは外へ出ずに遅らせる。SBは全力で戻る。",readjust:"{A}の8番が追い越し、{B}の6番の脇で数的優位を作る。",exception:"{B}が片SBを残して攻めているなら、背後は片側だけ。",sources:["cv-433","cv-att-transitions","cv-restdef"]}],adjustments:[{id:"adj-double",by:"B",scene:"adj-b-double",title:"8番を1枚下げて2ボランチ化",trigger:"{A}の8番に6番の両脇を使われ続ける。",change:"{B}の8番の1枚が6番の横まで下がり、中盤の底を2人にする（4-4-1-1寄り）。",effect:"6番の脇は埋まるが、前で{A}のCBと6番へ寄せる人数が減る。",response:{by:"A",text:"6番が前を向いて運び、空いた中盤の前のスペースから8番やWGへ展開する。"}},{id:"adj-451",by:"A",scene:"adj-a-451",title:"WGを下げて4-1-4-1で守る",trigger:"{B}のSB＋SHに大外の2v1を作られ続ける。",change:"{A}のWGが{B}のSBに付いて中盤ラインまで戻り、4-1-4-1（ほぼ同型）で守る。",effect:"大外は2v2に戻るが、奪った瞬間に前線に残るのはCF1人になる。",response:{by:"B",text:"CBが運んで{A}のCFの脇から前進し、8番を押し上げて{A}の6番の脇を狙う。"}},{id:"adj-invert",by:"A",title:"SBを内側に絞り、3-2-5で攻める",trigger:"{B}のCFが収め、SHが高いSBの背後へ走るカウンターを受ける。",change:"片方のSBが6番の横に入り、残り守備を2CB＋2ピボット寄りにする。",effect:"カウンターの出口はさらに細くなるが、大外の幅はWGだけで作ることになる。",response:{by:"B",text:"SHを高めに残し、内側に絞ったSBの外側をカウンターの出口にする。"}},{id:"adj-press",by:"B",title:"8番を上げてCB2枚へ2人で寄せる",trigger:"{A}のCBがCF1人の脇から運び続ける。",change:"{B}の8番の1枚がCFの横まで出て、4-4-2気味に{A}のCB2枚を2人で見る。",effect:"CBは運びにくくなるが、2人の背後で{A}の6番が空き、6番の脇もさらに広がる。",response:{by:"A",text:"CBから6番へ縦パスを入れ、8番2枚が{B}の6番の両脇へ走る。"}}],setPieces:[{title:"{A}の攻撃CK",text:"{B}は深く守る分、CF1人を前線に残しやすい。{A}は2CB＋6番のうち1人をPAに入れる計算が立つ。",evidence:"I"},{title:"{B}の攻撃CK",text:"{A}はWGを高く残しやすい。{B}はそのWGに対して何人を残すかを判断する。",evidence:"I"},{title:"セカンドボール",text:"PA外の回収は{A}の6番・8番 vs {B}の6番・8番。{B}は6番が前に出ると脇が空く。",evidence:"I"}],validity:{assumptions:["{A}は保持で2-3-5、非保持で4-3-3の前プレか4-1-4-1のミドルブロック。","{B}は非保持でSHが中盤に下がる4-1-4-1、保持では4-3-3に近い形になる。"],exceptions:["{B}のSHが守備でも高く残る（4-3-3の守備）なら、ほぼ同型対決になる。","{A}がSBをインバートして3-2-5で攻めると、8番の1枚は{B}の6番の脇ではなく中盤の底に残る。","{B}の6番が前に出ずCBの前に固定されるなら、脇のスペースは小さくなるが{A}の6番が自由になる。"],gameState:["{B}がリード：SHを最終ラインまで下げて6バック気味に守り、カウンターはCFの収めに頼る。","{A}がビハインド：SBを2枚とも上げて前線を厚くする代わりに、残り守備は2CB＋6番だけになる。"],profiles:["{B}の6番に、両脇をカバーする横の守備範囲があるか。","{A}の8番に、6番の脇で背後から寄せられても前を向ける技術があるか。","{B}のCFに、1人でボールを収める体の強さがあるか。"]},sources:["cv-433","cv-4141","cv-451","cv-midblock","cv-highpress","cv-restdef","cv-att-transitions","sv-halfspace","forcher2023rest","deep-research"],scenes:[{id:"overview",tab:"overview",poss:null,relax:!0,title:"{A} vs {B}：噛み合わせ（基本配置）",short:"基本配置",caption:"中盤は6番・8番2枚同士の3v3で、互いの8番が相手6番の脇を狙う。{B}は守備でSHが中盤に下がり、{A}は前線3枚 vs 4バック。後方は{A}の2CB＋6番 vs {B}のCF。",teams:{A:{from:"base",tweak:{ST:[50,74]}},B:{from:"base",tweak:{ST:[50,27]}}},overlays:[{t:"mark",a:"A:LCM",b:"B:RCM"},{t:"mark",a:"A:RCM",b:"B:LCM"},{t: oss"}],mechanisms:[{id:"m-sb-free",attacker:"A",phase:"buildup",scene:"ip-build",evidence:"I",title:"5-2-3のプレスで空くSB、出てきたWBの背後",premise:"{B}が5-2-3で前から寄せ、シャドーが{A}のCBへ、STが{A}の6番を見る。",setup:"{A}のGK＋2CB＋6番 vs {B}の前線3枚で4v3。{A}のSBは{B}のWBの前で空きやすい。",phenomenon:"SBにボールが入ると、{B}のWBは前に出るか下がるかを迫られる。出れば背後で{A}のWGが外CBと1v1になる。",aim:"SBからWBの背後へ。WGが外CBを外へ引き出し、CFと8番が3CBの間へ入る。",counter:"{B}のシャドーが外から内へ曲線で寄せ、CBからSBへのコースを背中で消す。外CBはWGに前で付く。",readjust:"{A}はWGが降りて外CBを引き出し、空いた背後へ8番が走る。",exception:"{B}のWBが前に出ず5バックのまま待つなら、SBは運べるが、背後のスペースは生まれない。",sources:["cv-433","cv-3241","cv-wingbacks"]},{id:"m-mid-3v2",attacker:"A",phase:"progression",scene:"ip-mid",evidence:"I",title:"5-4-1の中央2枚の脇で、8番が前を向く",premise:"{B}が5-4-1で構え、シャドーが外へ下がって{A}のSBを見る。",setup:"中盤中央は{A}の6番＋8番2枚 vs {B}のボランチ2枚で3v2。{B}のSTは{A}の6番を背中で消している。",phenomenon:"{A}のSBに{B}のシャドーが寄せると、シャドーとボランチの間が空く。ボランチが8番へ出れば、背後のCBの前が空く。",aim:"SBから8番へ斜めのパス。8番が前を向き、CFへの縦パスかWGとの連係。",counter:"{B}のシャドーは外から内へ寄せて、SBから8番へのコースを背中で消す。ボランチは横にスライドして間を詰める。",readjust:"{A}は6番がSTの脇へずれて、2人目の受け手になる。",exception:"{B}のシャドーが外へ下がらず中央に残るなら、大外の{A}のSBが空く。",sources:["cv-433","cv-451","cv-3241"]},{id:"m-channel",attacker:"A",phase:"final",scene:"ip-wide",evidence:"I",title:"WGがWBを止め、8番がCBとWBの間へ",premise:"{A}が押し込み、{B}が5-4-1で最終ラインに5人を並べる。",setup:"{A}のWGはWBと外CBの間に立つ。{A}のSBと8番が同じサイドに加わり、{B}はWB＋シャドーで受ける。",phenomenon:"WGが内側へ寄るとWBが付いて絞り、大外が空く。WBが付かなければ外CBがWGを見ることになり、CBとWBの間が空く。",aim:"8番がCBとWBの間へ走り、SBからのパスでPA内へ。または大外のSBのクロス。",counter:"{B}のボランチがスライドして8番に付き、外CBはWGを捨てずに内側を守る。",readjust:"{A}は逆WGがファーへ入り、5バックのファーサイドで数を合わせる。",exception:"{B}のシャドーが{A}のSBに付いて最終ラインまで戻るなら、6バックになって間は消える。",sources:["cv-433","pt-lance-linha5","sv-halfspace"]},{id:"m-shadows",attacker:"B",phase:"progression",scene:"oop-shadows",evidence:"I",title:"2シャドーが6番の両脇に立つ",premise:"{B}が3-2-5で押し込み、2シャドーが{A}の6番の両脇（8番とCBの間）に立つ。",setup:"{A}の6番1人 vs {B}のシャドー2人で1v2。{A}の8番は{B}のボランチ2枚を見ている。",phenomenon:"{A}の8番がボランチへ出ると、背後のシャドーへのコースが開く。6番が片方へ寄れば、逆のシャドーが空く。",aim:"ボランチから空いたシャドーへ縦パス。シャドーが前を向き、STの裏抜けかWBへ。",counter:"{A}の8番は外側から寄せてシャドーへのコースを背中で消す。シャド },{id:"five-lanes",cat:"space",ja:"5レーン",en:"Five lanes",aliases:[],short:"ピッチを縦に5本へ分けて立ち位置を整理する考え方。",long:"大外2本・ハーフスペース2本・中央1本。保持では各レーンに選手を置いて相手の守備者を分散させる。本サイトの図では「5レーン」レイヤーで表示できる。",related:["half-space","width"],sources:["sv-halfspace"]},{id:"pin",cat:"positioning",ja:"ピン留め",en:"Pinning",aliases:["固定"],short:"相手をその位置から動けなくする立ち位置。",long:"大外のWGが相手SBを外に留めると、SBとCBの間が広がる。2トップが相手CB2枚を固定すると、CBが前に出て潰しにくくなる。",related:["width","superiority"],sources:["cv-442"]},{id:"overload",cat:"positioning",ja:"オーバーロード",en:"Overload",aliases:["数的優位を作る"],short:"特定のエリアに人数をかけて数的優位を作ること。",long:"片側に人数を集めて相手を寄せ、逆サイドの1v1（アイソレーション）を作る使い方もある。",related:["isolation","superiority"],sources:["cv-thirdman"]},{id:"isolation",cat:"positioning",ja:"アイソレーション",en:"Isolation",aliases:[],short:"意図的に1対1を作ること。",long:"逆サイドに人数を集めてから、大外で待つWGへ展開して1v1を作る。質的優位を生かす典型的な手段。",related:["overload","superiority"],sources:[]},{id:"superiority",cat:"positioning",ja:"数的・位置的・質的優位",en:"Numerical / positional / qualitative superiority",aliases:["優位性"],i18n:{es:"superioridad numérica / posicional / cualitativa"},short:"数＝人数が多い、位置＝相手を無力化する位置取り、質＝個の能力差。",long:"数的優位はそのエリアの人数差、位置的優位は相手が関与できない立ち位置（ライン間、背中側など）、質的優位は1v1や空中戦などの個の差。スペイン語圏のポジショナルプレーの議論で区別される。本サイトでは「+1」などの記号を数的優位に限って使う。",related:["free-man","overload"],sources:["es-superioridad","sv-juego"]},{id:"free-man",cat:"positioning",ja:"フリーマン",en:"Free man",aliases:["フリーの選手","浮いている選手"],i18n:{es:"hombre libre"},short:"守備側の誰にも捕まっていない選手。",long:"数的・位置的優位の結果として生まれる。図では破線の円で示す。誰がフリーになるかは相手のプレス方式で変わるため、本サイトでは必ず条件とセットで示す。",related:["superiority"],sources:["sv-juego"]},{id:"pivot",cat:"positioning",ja:"ピボット（6番・ボランチ）",en:"Pivot",aliases:["アンカー","ボランチ","6番"],i18n:{de:"Sechser / Doppelsechs",es:"pivote",it:"regista / mediano"},short:"中盤の底で配球と守備のバランスを担う選手。",long:"1人ならシングルピボット（アンカー）、2人ならダブルピボット。ダブルピボットはSBの同時前進を支えやすく、シングルピボットは脇のスペースが論点になる。",related:["salida","rest-defence"],sources:["cv-doublepivot","de-abkippen"]},{id:"build-up",cat:"ip",ja:"ビルドアップ",en:"Build-up",aliases:["組み立て"],i18n:{es:"salida de balón",it:"costruzione dal basso",pt:"saída de bola"},short:"GK・DFから組織的に前進を始める局面。",long:"FIFAの局面分類（EFI）では、相手のプレッシャーの有無でビルドアップを区別する。本サイトでは「第1ライン（ボールを持つ最後方の列）vs 相手の第1プレス」の人数から読む。",related:["salida","first-line"],sources:["fifa-ip","fifa-efi","uefa-ucl-2223"]},{id:"first-line",cat:"ip",ja:"第1ライン",en:"First line",aliases:[],short:"ビルドアップでボールを持つ最後方の列（CB・GK・降りた6番など）。",long:"相手の第1プレス（FWなど）との人数差が、ビルドアップの出発点になる。例：2CB＋6番 vs 2トップ＝3v2。",related:["build-up","superiority"],sources:[]},{id:"line-breaking",cat:"ip",ja:"ラインブレイク",en:"Line-breaking pass",aliases:["縦パス"],short:"相手の守備ラインを越えて味方に届くパス。",long:"ライン間で受ける選手（8番、10番、降りるFW）への縦パスが典型。",related:["depth","third-man"],sources:[]},{id:"third-man",cat:"ip",ja:"サードマン",en:"Third-man run",aliases:["3人目の動き"],i18n:{es:"tercer hombre",pt:"terceiro homem"},short:"2人のパス交換の間に、3人目が前向きで受ける動き。",long:"2v2の状況を数的優位に変える。受け手を捕まえに出た守備者の背後を、3人目が使う形が多い。",related:["overload","line-breaking"],sources:["cv-thirdman","cv-glossary"]},{id:"overlap",cat:"ip",ja:"オーバーラップ",en:"Overlap",aliases:[],short:"ボール保持者の外側を後ろから追い越す動き。",long:"大外で2v1を作る基本形。追い越した選手の背後（残り守備）の管理とセットで考える。",related:["underlap","rest-defence"],sources:[]},{id:"underlap",cat:"ip",ja:"アンダーラップ",en:"Underlap",aliases:["インナーラップ"],short:"ボール保持者の内側を追い越す動き。",long:"WGが大外で相手SBをピン留めしているとき、SBや8番がCBとSBの間（チャネル）へ走り込む。",related:["overlap","channel"],sources:[]},{id:"invert",cat:"ip",ja:"インバート",en:"Inverted full-back",aliases:["偽SB","偽サイドバック"],short:"SBやWBが中盤の内側へ入る動き。",long:"中央の人数を増やし、6番の横に2人目のピボットを作る。ボールを失ったときの残り守備も厚くなる。代わりに大外の人数が減る。",related:["pivot","rest-defence"],sources:["uefa-observers-2122"]},{id:"salida",cat:"ip",ja:"6番落とし（サリーダ・ラボルピアーナ）",en:"Salida lavolpiana",aliases:["アンカー落とし"],i18n:{es:"salida lavolpiana",de:"abkippender Sechser"},short:"6番がCBの間・横へ降り、第1ラインを3枚にするビルドアップ。",long:"2トップのプレスに対して3v2を作る。メキシコで指揮したリカルド・ラ・ボルペの名に由来する呼び名。代わりに中盤中央の人数が1人減る。",related:["build-up","pivot"],sources:["es-lavolpiana","de-abkippen"]},{id:"braccetto",cat:"ip",ja:"外CB（ブラッチェット）",en:"Wide centre-back (back three)",aliases:[],i18n:{it:"braccetto"},short:"3バックの左右のCB。持ち運び、WBの背後のカバー、相手WGへの対応を担う。",long:"イタリア語圏の通称。3バックが機能するかは、この選手が運べるか、WBの背後へスライドできるかで大きく変わる。",related:["channel"],sources:["cv-back3"]},{id:"block",cat:"oop",ja:"ハイ／ミドル／ローブロック",en:"High / mid / low block",aliases:[],short:"非保持で守備組織を構える高さ。",long:"FIFAの局面分類（EFI）では、ブロックの高さと保持者への圧力で区別する。本サイトの図では「ミドルブロック」を基準に、ハイプレスとローブロックを別の形として扱う。",related:["compactness","trigger"],sources:["fifa-oop","fifa-efi","cv-midblock","cv-lowblock"]},{id:"compactness",cat:"oop",ja:"コンパクトネス",en:"Compactness",aliases:[],short:"チームの縦横の距離の小ささ。",long:"位置データの研究では、チームの幅・長さ・面積などで測られる。コンパクトさは選手配置だけでなく、相手や数的関係などの文脈でも変わる。",related:["block","slide"],sources:["low2020"]},{id:"slide",cat:"oop",ja:"スライド",en:"Shift / slide",aliases:[],short:"ボールサイドへ守備ブロック全体が横に移動すること。",long:"4-4の2列はスライドしやすいとされる。中盤3枚（5-3-2など）は、大きなサイドチェンジに対してスライドの距離が長くなる。",related:["compactness"],sources:["cv-442","cv-inzaghi"]},{id:"jump",cat:"oop",ja:"ジャンプ",en:"Jump / step out",aliases:["前に出る"],short:"自分のラインを離れて前へ出る守備。",long:"出た選手の背後を誰が埋めるかとセットで考える。8番のジャンプは6番の脇を、WBのジャンプはチャネルを空けやすい。",related:["pressing-trap","channel"],sources:["cv-4141","cv-inzaghi"]},{id:"man-oriented",cat:"oop",ja:"マンオリエンテーション",en:"Man-oriented defending",aliases:["マンツーマン寄り"],short:"ゾーンを基準にしつつ、特定の相手を基準に位置を取る守備。",long:"相手がマン寄りで守ると、数的優位の場所よりも「人を引き出して空いた背後」を使うことが主題になる。本サイトの多くの分析は、ゾーン基準を前提条件として明記している。",related:["free-man"],sources:[]},{id:"trigger",cat:"pressing",ja:"プレッシングトリガー",en:"Pressing trigger",aliases:["プレスのスイッチ"],short:"プレスを一斉に始めるきっかけ。",long:"バックパス、SBやWBへのパス、背を向けたトラップ、浮き球などが典型。トリガーが共有されていないと、1人だけが出て背後を空ける。",related:["pressing-trap","cover-shadow"],sources:["cv-highpress"]},{id:"cover-shadow",cat:"pressing",ja:"カバーシャドウ",en:"Cover shadow",aliases:["背中で消す"],short:"寄せる選手が自分の背中で、背後の相手へのパスコースを消すこと。",long:"図では扇形の影で示す。2トップが相手CBへ寄せながら6番を背中で消せるかが、多くのマッチアップの分かれ目になる。",related:["trigger","first-line"],sources:["cv-442"]},{id:"pressing-trap",cat:"pressing",ja:"プレッシングトラップ",en:"Pressing trap",aliases:["罠"],short:"空いて見えるエリアへボールを誘い込み、複数人で一気に囲む。",long:"外へ追
