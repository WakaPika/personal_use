<script>(()=>{var Oe={id:"4-3-3",status:"analysis",family:"back4",alias:"シングルピボット＋2人の8番＋3トップ",summary:"1アンカー（6番）＋2人の8番＋3トップ。5レーンを埋めやすく、前線3枚で高い位置からプレスできる。構造的な弱点は6番の脇と、SB・WGの間（SBの背後）。",slots:[{id:"GK",label:"GK",name:"GK",line:"GK",lane:"central"},{id:"LB",label:"SB",name:"左SB",line:"DF",lane:"wide"},{id:"LCB",label:"CB",name:"左CB",line:"DF",lane:"central"},{id:"RCB",label:"CB",name:"右CB",line:"DF",lane:"central"},{id:"RB",label:"SB",name:"右SB",line:"DF",lane:"wide"},{id:"DM",label:"6",name:"6番（アンカー）",line:"MF",lane:"central"},{id:"LCM",label:"8",name:"左8番",line:"MF",lane:"central"},{id:"RCM",label:"8",name:"右8番",line:"MF",lane:"central"},{id:"LW",label:"WG",name:"左WG",line:"FW",lane:"wide"},{id:"ST",label:"CF",name:"CF",line:"FW",lane:"central"},{id:"RW",label:"WG",name:"右WG",line:"FW",lane:"wide"}],shapes:[{id:"base",label:"基本配置 4-3-3",note:"公称配置。6番が2人の8番の後ろに立つ三角形が基準。",pos:{GK:[50,4],LB:[15,24],LCB:[37,18],RCB:[63,18],RB:[85,24],DM:[50,34],LCM:[32,47],RCM:[68,47],LW:[14,66],ST:[50,70],RW:[86,66]}},{id:"ip.235",label:"保持 2-3-5",note:"両SBが6番と同じ高さへ。8番が前線のハーフスペース、WGが大外で前線5枚。残り守備は2CB＋6番。",pos:{GK:[50,6],LCB:[33,20],RCB:[67,20],LB:[16,40],DM:[50,36],RB:[84,40],LW:[6,74],LCM:[31,70],ST:[50,77],RCM:[69,70],RW:[94,74]}},{id:"ip.325",label:"保持 3-2-5",note:"右SBが残って3バック、左SBが6番の横へ入る（インバート）。中央の2ピボットで6番が消されにくい。",pos:{GK:[50,6],LCB:[32,18],RCB:[54,16],RB:[76,20],LB:[40,36],DM:[60,36],LW:[6,74],LCM:[31,70],ST:[50,77],RCM:[69,70],RW:[94,74]}},{id:"oop.high",label:"ハイプレス 4-3-3",note:"CF＋2WGが第1ライン、8番が相手CM／ピボットへジャンプ。6番は中盤の背後を一人で管理。",pos:{GK:[50,9],LB:[16,42],LCB:[38,36],RCB:[62,36],RB:[84,42],DM:[50,52],LCM:[36,66],RCM:[64,66],LW:[22,82],ST:[50,86],RW:[78,82]}},{id:"oop.mid",label:"ミドルブロック 4-1-4-1",note:"WGが中盤ラインまで下がる。6番がCB前、4人の中盤ラインで横幅を守る。",pos:{GK:[50,5],LB:[17,26],LCB:[39,24],RCB:[61,24],RB:[83,26],DM:[50,36],LW:[16,47],LCM:[37,48],RCM:[63,48],RW:[84,47],ST:[50,61]}},{id:"oop.low",label:"ローブロック 4-5-1",note:"中盤5枚がPA前を横幅ごと守る。8番はSBのサポートでクロス対応まで下がる。",pos:{GK:[50,3],LB:[19,14],LCB:[40,12],RCB:[60,12],RB:[81,14],DM:[50,24],LW:[18,29],LCM:[37,31],RCM:[63,31],RW:[82,29],ST:[50,45]}}],facts:[{key:"width",label:"幅",level:3,text:"WGが大外に常駐。保持時はSBも加わり5レーンを埋めやすい。"},{key:"depth",label:"深さ（段差）",level:3,text:"6番–8番–前線の3段。縦パスの角度を作りやすい。"},{key:"central",label:"中央密度",level:2,text:"中央MFは3枚。非保持で4-1-4-1にすると中盤ラインは5枚。"},{key:"buildup",label:"第1ライン",value:"2CB＋6（＋GK）",text:"相手2トップなら3v2、GK込みで4v2。"},{key:"press",label:"第1プレス",value:"CF＋2WG",text:"8番のジャンプで中盤を捕まえる。"},{key:"rest",label:"残り守備",value:"2CB＋6（2+1）",text:"片SBを残せば3+1。"}],phases:{buildUp:"2CB＋6番（＋GK）で第1ラインを作る。相手が2トップなら3v2（GK込み4v2）、1トップならCBが運べる。6番が背中で消されたら、6番がCB間に降りて3枚化するか、片SB／8番が降りて2ピボットにする。",progression:"8番が相手MFラインの外側・背後（ハーフスペース）に立ち、WGは大外で相手SBをピン留めする。6番への縦パス、CBの持ち運び、SB経由の外循環が主な前進ルート。",finalThird:"WG（大外）＋8番（ハーフスペース）＋CF（中央）で前線5レーンを埋める。SBの追い越しで大外2v1を作り、カットバックとファーへのクロスを狙う。",highPress:"CF＋2WGが第1ライン、8番がジャンプして相手CM／ピボットを捕まえる。WGが内側から寄せてSBを背中で消す方法と、外から寄せて中央の罠へ誘導する方法がある。",midBlock:"WGが下がって4-1-4-1。6番がCB前のスペースをスクリーンし、8番は中央を優先して閉じる。外を越えられたら8番がスライドしてSBを助ける。",lowBlock:"4-5-1。8番がSBの背後をカバーしてクロスに対応し、CBがPAの外へ釣り出されないようにする。",attTransition:"奪ったらWGの幅を使った速い展開が第一の出口。CFは中央で起点を作り、逆WGが背後へ、8番が2列目から追い越す。",defTransition:"ボール周辺の8番・WG・CFで即時奪回（カウンタープレス）。後方は2CB＋6番（＋片SB）で背後と最初の縦パスを管理する。",restDefence:"両SBを高くすると2CB＋6番の2+1。相手が2トップなら同数に近づくため、片SBを残した3+1（3-2-5）に切り替える判断が多い。"},roles:[{slot:"DM",title:"6番（アンカー）",text:"第1ライン直後の受け手。前を向けるかで前進の質が決まる。非保持ではCB前のスペースと8番の背後を一人でカバーする。"},{slot:"LCM",title:"8番",text:"ハーフスペースで受けて前進し、PAへ遅れて侵入。非保持では相手CM／ピボットへのジャンプ役。"},{slot:"LW",title:"WG",text:"大外で相手SBをピン留めし1v1。非保持はSBへのコースを消しながらCBへ寄せ、ブロックではSHの位置まで戻る。"},{slot:"ST",title:"CF",text:"CB間でピン留めと裏抜け、降りて8番やWGを使う。相手が3CBだと数的に孤立しやすい。"},{slot:"LB",title:"SB",text:"保持では大外の幅役か、内側に入る2枚目のピボット（インバート）。非保持はWGと縦関係で大外を守る。"},{slot:"LCB",title:"CB",text:"幅を取って相手FWの間隔を広げ、空いたら運ぶ。残り守備の最後尾として相手CFの背後抜けを管理。"},{slot:"GK",title:"GK",text:"ビルドアップの+1。相手2トップに対して第1ラインを4v2にできるかは足元の質次第。"}],strengths:[{title:"前線3枚で高い位置から圧力",why:"CF＋2WGが相手CB・SBの近くに立てるため、ボールを失った直後やハイプレスで人数をかけやすい。8番のジャンプで中盤も捕まえられる。",sources:["cv-433"]},{title:"5レーンを埋めやすい",why:"WGが大外、8番がハーフスペース、CFが中央。SBが上がれば大外で2v1も作れる。",sources:["cv-433","sv-halfspace"]},{title:"中央の三角形",why:"6番＋8番2枚の段差でパスの角度が生まれる。中央MFが2枚の相手には中央で+1になりやすい。",sources:["cv-433","cv-433-key"]}],weaknesses:[{title:"6番の脇",why:"6番は1人で横幅を守るため、8番が前へジャンプした瞬間に脇（ハーフスペース）が空く。相手の10番や降りるFWの受け場所になる。",sources:["cv-433"]},{title:"SBとWGの間、SBの背後",why:"WGが高く残るとSBが大外で数的不利になり、素早いサイドチェンジでその状態を突かれやすい。",sources:["cv-433"]},{title:"1トップの孤立",why:"相手が2CB・3CBならCFは常に数的不利。WG・8番の押し上げが遅いと起点を作れない。",sources:["cv-433"]},{title:"両SB前進時の残り守備",why:"2CB＋6番の3枚で相手2トップを見ると+1しかなく、6番がボールへ出ると2v2になる。",sources:["cv-restdef"]}],variations:{ip:[{shape:"ip.235",label:"2-3-5",text:"両SBが上がり、8番が前線のハーフスペースへ。前線の人数と幅は最大、残り守備は2CB＋6番。"},{shape:"ip.325",label:"3-2-5",text:"片SBが残って3バック、逆SBが6番の横へ（インバート）。2トップの相手に6番を消されにくい。"},{label:"6番落とし（西: salida lavolpiana）",text:"6番がCBの間へ降りて第1ラインを3枚化。2トップのプレスに+1を作るが、中盤中央は1枚減る。"}],oop:[{shape:"oop.high",label:"ハイプレス 4-3-3",text:"CF＋WGで第1ライン、8番がジャンプ。"},{shape:"oop.mid",label:"ミドル 4-1-4-1",text:"WGが中盤ラインへ。6番がCB前をスクリーン。"},{shape:"oop.low",label:"ロー 4-5-1",text:"中盤5枚でPA前を横幅ごと守る。"}]},sources:["cv-433","cv-433-key","cv-restdef","cv-4141","sv-halfspace","es-lavolpiana","bradley2011","tierney2016"]};var Ve={id:"4-4-2",status:"analysis",family:"back4",alias:"2トップ＋フラットな4-4の2ライン",summary:"2トップ＋4枚の2ライン。2トップが相手CB2枚を同時に固定でき、2列の横スライドでコンパクトに守りやすい。中央MFが2枚のため、3枚の中盤には人数とパス角度で不利になりやすい。",slots:[{id:"GK",label:"GK",name:"GK",line:"GK",lane:"central"},{id:"LB",label:"SB",name:"左SB",line:"DF",lane:"wide"},{id:"LCB",label:"CB",name:"左CB",line:"DF",lane:"central"},{id:"RCB",label:"CB",name:"右CB",line:"DF",lane:"central"},{id:"RB",label:"SB",name:"右SB",line:"DF",lane:"wide"},{id:"LM",label:"SH",name:"左SH",line:"MF",lane:"wide"},{id:"LCM",label:"CM",name:"左CM",line:"MF",lane:"central"},{id:"RCM",label:"CM",name:"右CM",line:"MF",lane:"central"},{id:"RM",label:"SH",name:"右SH",line:"MF",lane:"wide"},{id:"LS",label:"CF",name:"左CF",line:"FW",lane:"central"},{id:"RS",label:"CF",name:"右CF",line:"FW",lane:"central"}],shapes:[{id:"base",label:"基本配置 4-4-2",note:"公称配置。DF4・MF4・FW2の3ライン。",pos:{GK:[50,4],LB:[15,24],LCB:[37,18],RCB:[63,18],RB:[85,24],LM:[15,46],LCM:[39,42],RCM:[61,42],RM:[85,46],LS:[41,65],RS:[59,65]}},{id:"ip.244",label:"保持 2-4-4",note:"SBが上がってCMと同じ高さへ。SHは内側の高い位置、2トップと並んで前線4枚。",pos:{GK:[50,6],LCB:[35,20],RCB:[65,20],LB:[12,42],LCM:[40,39],RCM:[60,39],RB:[88,42],LM:[22,68],LS:[42,76],RS:[58,76],RM:[78,68]}},{id:"oop.high",label:"ハイプレス 4-4-2",note:"2トップが相手CBへ。SHは相手SB、CMは相手の中盤を捕まえる位置まで押し上げる。",pos:{GK:[50,9],LB:[16,42],LCB:[38,36],RCB:[62,36],RB:[84,42],LM:[18,64],LCM:[40,58],RCM:[60,58],RM:[82,64],LS:[40,82],RS:[60,82]}},{id:"oop.mid",label:"ミドルブロック 4-4-2",note:"2トップが相手ピボットへのコースを背中で消し、SHが絞ってフラットな4枚を作る。",pos:{GK:[50,5],LB:[16,26],LCB:[39,24],RCB:[61,24],RB:[84,26],LM:[19,43],LCM:[40,41],RCM:[60,41],RM:[81,43],LS:[42,57],RS:[58,57]}},{id:"oop.low",label:"ローブロック 4-4-1-1",note:"2列を低く。FWの1枚が下がって相手ピボットを見る。",pos:{GK:[50,3],LB:[18,14],LCB:[39,12],RCB:[61,12],RB:[82,14],LM:[20,28],LCM:[40,27],RCM:[60,27],RM:[80,28],LS:[50,39],RS:[52,52]}}],facts:[{key:"width",label:"幅",level:2,text:"SHが幅を担当。保持時はSBが上がって大外を取る。"},{key:"depth",label:"深さ（段差）",level:1,text:"同じライン上に並びやすく、ライン内の段差が少ない。"},{key:"central",label:"中央密度",level:1,text:"中央MFは2枚。SHが絞れば非保持で4枚。"},{key:"buildup",label:"第1ライン",value:"2CB＋2CM",text:"ボックス型。2トップへの長いボールも常に選択肢。"},{key:"press",label:"第1プレス",value:"2トップ",text:"相手CB2枚を同時に見られる。"},{key:"rest",label:"残り守備",value:"2CB＋2CM（2+2）",text:"SBを上げても4枚が残りやすい。"}],phases:{buildUp:"2CB＋2CMのボックス、またはSB経由で前進する。2トップへの長いボールで相手の最終ラインと直接勝負する選択肢を常に持てる。",progression:"SB→SH→CFの縦の連係と、2トップの縦関係（片方が降りて受け、片方が背後へ）。中央は2枚なので、外→中の順で前進することが多い。",finalThird:"2トップでPA内にニアとファーの2人を確保できる。SHの内側侵入とSBのオーバーラップで大外からクロス。",highPress:"2トップが相手CBへ寄せ、外へ追い出してサイドで閉じ込めるか、内へ誘導して中央の罠にかける。後方のFWが背後から挟み、CMが前から寄せる形もある。",midBlock:"2トップが相手ピボットへのコースを背中で消し、SHが絞ってフラットな4枚を作る。2列のままボールサイドへ横スライドしてコンパクトさを保つ。",lowBlock:"4-4の2ラインを低く構え、FWの1枚が下がって4-4-1-1や4-5-1になる。PA前の中央を2列で埋める。",attTransition:"奪ったら2トップが即座の出口。1人が足元で起点を作り、もう1人が背後へ走る。SHが外から追い越す。",defTransition:"2CMと2CBが中央を締め、SHが帰陣する。2トップは相手の最初のパス（CB・ピボット）を遅らせる。",restDefence:"SBを上げても2CB＋2CMの4枚が残りやすい。相手が1トップなら後方は大きな数的優位。"},roles:[{slot:"LS",title:"CF（2トップ）",text:"2人で相手CB2枚を固定する。ターゲットと裏抜けの組み合わせ。非保持では第1ラインと、相手ピボットへのカバーシャドウ。"},{slot:"LCM",title:"CM",text:"2枚で中央を横幅ごと守る。片方が前に出たら片方は残る。セカンドボール回収の中心。"},{slot:"LM",title:"SH",text:"保持時は幅か内側の受け手、非保持は絞って中盤4枚目。大外の守備と中央の補助を両立する負荷が最も大きい。"},{slot:"LB",title:"SB",text:"SHと縦関係で大外を担当。相手WGやWBとの1対1が多い。"},{slot:"LCB",title:"CB",text:"相手2トップとは2v2になりやすく、対人の強さが要求される。相手1トップなら+1。"},{slot:"GK",title:"GK",text:"ロングボールの起点と背後のカバー。"}],strengths:[{title:"2トップがCB2枚を固定",why:"相手最終ラインの中央に2v2を作り、CBのどちらも前に出にくくする。",sources:["cv-442","cv-twoupfront"]},{title:"明確な2ラインで横スライドが容易",why:"4枚×2列はボールサイドへのスライドでコンパクトさを保ちやすい。",sources:["cv-442"]},{title:"奪った後の出口と人数",why:"前線に2人残るため、奪った瞬間の出口と追い越しの人数を確保できる。",sources:["cv-442"]}],weaknesses:[{title:"中央2枚 vs 中盤3枚",why:"相手が6番＋8番2枚なら中央は2v3。SHが絞れば同数にできるが、今度は大外が空く。",sources:["cv-442","cv-442-diamond"]},{title:"段差の少なさ（ライン間）",why:"同じ高さに並ぶため、選手間を通す縦パス1本で複数人が外されやすい。",sources:["cv-442"]},{title:"第1ラインが3枚になると数的不利",why:"相手が3バックや6番落としで第1ラインを3枚にすると、2トップでは1人余る。",sources:["es-lavolpiana"]}],variations:{ip:[{shape:"ip.244",label:"2-4-4",text:"SBが上がり、SHが内側の高い位置へ。前線4枚で相手最終ラインを押し下げる。"},{label:"4-4-1-1（2トップの縦関係）",text:"FWの1枚が降りて中盤とつなぐ。中央の人数不足を補う。"}],oop:[{shape:"oop.high",label:"ハイプレス 4-4-2",text:"2トップが相手CBへ。外切りでサイドに閉じ込める。"},{shape:"oop.mid",label:"ミドル 4-4-2",text:"SHが絞ったフラット4。2トップがピボットを消す。"},{shape:"oop.low",label:"ロー 4-4-1-1",text:"FW1枚がピボット番。2列を低く。"},{label:"ダイヤモンド（4-1-2-1-2）",text:"中央の人数不足を解消する別形。幅は失う。"}]},sources:["cv-442","cv-twoupfront","cv-442-diamond","es-lavolpiana","bradley2011","tierney2016"]};var _e={id:"4-2-3-1",status:"analysis",family:"back4",alias:"ダブルボランチ＋トップ下＋1トップ",summary:"ダブルボランチ（2ピボット）＋トップ下（10番）＋1トップ。2枚のボランチで中央と残り守備を安定させ、10番がライン間で受ける。非保持では10番が上がって4-4-2や4-4-1-1になりやすい。",slots:[{id:"GK",label:"GK",name:"GK",line:"GK",lane:"central"},{id:"LB",label:"SB",name:"左SB",line:"DF",lane:"wide"},{id:"LCB",label:"CB",name:" で第1・第2ラインを作る。相手が1トップなら、ボランチのどちらかが前向きでフリーになりやすい。",progression:"10番が相手MFラインの背後（ライン間）で受け、SHは内と外を使い分ける。ボランチの片方が前進して8番化すると中盤3枚になる。",finalThird:"SH＋10番＋CFの4人で最終ライン前を攻め、SBが大外を取る。1トップはPA内の人数が少なくなりやすく、逆SHのファー侵入が鍵。",highPress:"10番が1列上がって4-4-2化。CFがCBへ寄せ、10番は相手ピボットを背中で消すか捕まえる。",midBlock:"4-4-1-1。逆サイドのSHが絞って中央に1枚加える。ボランチがCB前を守り、片方が前に出て10番やSHとプレスする。",lowBlock:"4-5-1や4-4-1-1で低く守り、1トップは高めに残してカウンターの起点にする。",attTransition:"10番＋SH＋CFの3人が速い出口。1トップへの縦パスと、10番のサポートの距離が鍵。",defTransition:"2枚のボランチが即座に中央を保護し、2CBと合わせた4枚で残り守備を作る。",restDefence:"2CB＋2ボランチの2+2を作りやすく、両SBを同時に上げやすい。"},roles:[{slot:"AM",title:"10番（トップ下）",text:"ライン間の受け手。非保持では最も位置を変える選手で、上がって第1ラインに入るか、下がって相手ピボットを見る。"},{slot:"LDM",title:"ボランチ（2ピボット）",text:"2枚で横幅を分担し、片方が前、片方が残る。CB前のスペースを守り、SBの前進を支える。"},{slot:"LM",title:"SH",text:"保持時は内側のポケットと大外を使い分け、非保持は相手SBへの対応。"},{slot:"ST",title:"CF（1トップ）",text:"背負う・裏へ抜ける・プレスを始める。CB2枚に対して孤立しやすい。"},{slot:"LB",title:"SB",text:"ボランチ2枚の保護があるため、両SBが同時に上がりやすい。"},{slot:"LCB",title:"CB",text:"相手1トップには+1。ボランチとの4枚で前進の土台を作る。"},{slot:"GK",title:"GK",text:"4枚のビルドアップに加わって+1を作る。"}],strengths:[{title:"2+2で中央が安定",why:"ボランチ2枚がCB前を守るため、両SBの同時前進やボールロスト後の中央保護がしやすい。",sources:["cv-4231","cv-doublepivot"]},{title:"ライン間の10番",why:"相手MFラインの背後に常駐する受け手がいるので、縦パス1本で前進できる。",sources:["cv-4231"]},{title:"4-4-2への切替が速い",why:"10番が1列上がるだけで第1ラインが2枚になり、ハイプレスへ移行できる。",sources:["cv-4231"]}],weaknesses:[{title:"1トップの孤立",why:"相手CB2枚に対してCFが1人。10番やSHの距離が遠いと起点を作れない。",sources:["cv-4231"]},{title:"10番が高すぎると中盤で数的不利",why:"非保持で10番が戻らないと、ボランチ2枚 vs 相手の中盤3枚になる。",sources:["cv-4231"]},{title:"ボランチの横並び",why:"2枚が同じ高さに並ぶと、片方が釣り出された瞬間に背後のスペースが広がる。",sources:["cv-doublepivot"]}],variations:{ip:[{shape:"ip.2413",label:"2-4-1-3",text:"両SBがボランチと同じ高さへ。SHは内側、10番はライン間。"},{label:"3-2-4-1（片SB残し）",text:"片SBが残って3バック化。SHと10番、CFで前線を厚くする。"}],oop:[{shape:"oop.high",label:"ハイプレス 4-4-2",text:"10番がCFの横へ上がる。"},{shape:"oop.mid",label:"ミドル 4-4-1-1",text:"10番が相手ピボット番。"},{shape:"oop.low",label:"ロー 4-4-1-1",text:"CFは高めに残してカウンター要員。"}]},sources:["cv-4231","cv-4231-key","cv-doublepivot","tie かを強制できているか。",scene:"ip-prog",at:[24,57]},{text:"SBを上げた後、2CB＋6番が2トップに+1を保てているか",look:"自陣側のセンターライン付近",why:"6番が即時奪回に出ると2CB vs 2トップの2v2。上がったSBの裏が狙われる。",scene:"tr-loss",at:[75,31]}],B:[{text:"2トップは6番を背中で消しながらCBへ寄せられているか",look:"2トップの間と、その背後の6番",why:"6番を消せないと中盤中央で2v3。片方を6番番にすると第1ラインは1v2。",scene:"ip-build",at:[50,42]},{text:"SHは8番を見るのか、SBを見るのか",look:"SHとCMの間",why:"SHが絞ると外のSBが、出ると8番が空く。CMとの受け渡しが噛み合っているか。",scene:"ip-prog",at:[77,59]},{text:"奪った瞬間、2トップで相手SBの裏を突けているか",look:"相手SBの背後",why:"相手が2-3-5で攻めているとき、残り守備は2CB＋6番の3人だけ。",scene:"tr-loss",at:[24,12]}]},superiority:[{kind:"numerical",zone:"第1ライン（{A}保持）",a:3,b:2,text:"{A}の2CB＋6番 vs {B}の2トップ。GKを含めると4v2。",when:"2トップが横並びでCBへ出ているとき"},{kind:"numerical",zone:"中盤中央",a:3,b:2,text:"{A}の6番＋8番2枚 vs {B}のCM2枚。",when:"{B}のSHが外にいるとき。SHが絞れば3v4"},{kind:"numerical",zone:"{A}の最前線",a:3,b:4,text:"{A}のWG・CF・WG vs {B}の4バック。{A}はWGのピン留め（位置）で補う。",when:"常に（公称配置）"},{kind:"numerical",zone:"{B}の最前線",a:3,b:2,text:"{B}の2トップ vs {A}の2CB＋6番。6番が前に出ると2v2。",when:"{A}が両SBを上げているとき"},{kind:"positional",zone:"ライン間",holder:"A",text:"{A}の8番が{B}のCMとSHの間・背後に立てば、{B}の2列の間で前を向ける。",when:"{B}の2列の距離が開いたとき"},{kind:"positional",zone:"最終ライン中央",holder:"B",text:"{B}の2トップが{A}のCB2枚を固定し、CBが前に出て潰しにくくなる。",when:"6番がCBの前にいないとき"},{kind:"qualitative",zone:"大外の1v1",holder:"A",text:"{A}のWG vs {B}のSB。WGが1v1で勝てる選手なら、大外のアイソレーションが最も速い崩し。",when:"WGの個の質が高い場合のみ"},{kind:"qualitative",zone:"空中戦",holder:"B",text:"{B}のCF vs {A}のCB。空中戦に強いCFがいれば、ロングボールで中盤を飛ばせる。",when:"CFの空中戦の質が高い場合のみ"}],freemen:[{who:"{A}の6番",when:"{B}の2トップが横並びでCB2枚へ寄せたとき",scene:"ip-build"},{who:"{A}のSB（ボールサイド）",when:"{B}のSHが8番を見て内側へ絞ったとき",scene:"ip-prog"},{who:"{B}のGK",when:"{A}が前線5人でボールサイドを閉じたとき（GK経由で逆サイドへ）",scene:"oop-press"},{who:"{A}のCB",when:"{B}がFW1枚を6番番に下げたとき",scene:"adj-b-4411"}],interplay:[{builder:"A",build:"2CB＋6（＋GK）",press:"2トップ（＋CMのジャンプ）",a:3,b:2,key:"2トップが6番を消せばCBが、CBに出れば6番が空く。",escape:"6番落とし／SBのインバート／GKを使った+1",scene:"ip-build"},{builder:"B",build:"2CB＋2CM（＋GK）",press:"CF＋2WG（＋8番のジャンプ）",a:3,b:3,key:"第1ラインはGKを含めて同数。WGがCBに出ればSB、SBに出ればCBが空く。",escape:"GK経由の逆サイド／2トップへのロングボール",scene:"oop-press"}],restDefence:{A:{shape:"2CB＋6番（2+1）",vs:"{B}の2トップ",a:3,b:2,note:"6番が即時奪回に出ると2v2。片SBを残せば4v2（3+1）。"},B:{shape:"2CB＋2CM（2+2）",vs:"{A}のCF（＋WG）",a:1,b:4,note:"SBが上がると、その背後に{A}のWGが残る。"}},duels:[{a:"6番",b:"2トップ",text:"6番が2トップの背後で前を向けるか。2トップが背中で消せるか。",scene:"ip-build"},{a:"8番",b:"CM・SH",text:"8番がハーフスペースで受けたとき、SHが絞るのか、CMが出るのか。",scene:"ip-prog"},{a:"WG",b:"SB",text:"大外の1v1とピン留め。WGが内側に入ったとき、SBが付いて行くか。",scene:"ip-prog"},{a:"SB",b:"SH",text:"{A}のSBが上がったとき、{B}のSHが下がって付くのか、前に残ってカウンターの起点になるのか。",scene:"tr-win"},{a:"CB",b:"2トップ",text:"残り守備で2v2にされないか（6番の位置）。ロングボールの競り合い。",scene:"tr-loss"}],mechanisms:[{id:"m-firstline",attacker:"A",phase:"buildup",scene:"ip-build",evidence:"I",title:"第1ライン3v2：6番が2トップの背後で前を向く",premise:"{B}の2トップが横並びのまま{A}のCB2枚へ寄せ、6番へのコースを背中で消せていない。",setup:"{A}は2CB＋6番（＋GK）、{B}は2トップ。第1ラインは3v2、GKを含めると4v2。",phenomenon:"CBから2トップの間を通す縦パスが6番に入り、6番が{B}の中盤ラインの前で前を向く。",aim:"6番から8番（CMの外側）やWGへ展開し、{B}の中盤4枚を横に動かしてから縦へ。",counter:"2トップを縦関係にして1人が6番を消す。またはCMの1枚が6番へジャンプする。",readjust:"6番がCBの間に降りて3枚化する（西: salida lavolpiana）か、8番やSBを6番の横へ入れて受け手を2人にする。",exception:"GKやCBが足元でプレスを外せないと+1は形だけになり、{B}はCBへ寄せるだけでミスを誘える。",sources:["cv-442","cv-433","es-lavolpiana","uefa-ucl-2223"]},{id:"m-halfspace8",attacker:"A",phase:"progression",scene:"ip-prog",evidence:"I",title:"8番がCMとSHの間で受ける：SBか6番のどちらかが空く",premise:"{B}のCM2枚が中央で6番と8番の両方を見ていて、SHは外の{A}のSBを基準に立っている。",setup:"{A}の8番が{B}のCMとSHの間（ハーフスペース）、WGは大外で{B}のSBをピン留め。中盤中央は3v2。",phenomenon:"8番に縦パスが入ると、{B}はSHを絞らせるかCMを出すかを迫られる。SHが絞れば{A}のSBが、CMが出れば6番が空く。",aim:"空いたSBが運んでWGと大外2v1を作る。または空いた6番を経由して逆サイドへ。",counter:"SHを最初から内側に絞ってコンパクトに守り、外のSBにはボールが出てからスライドする。CMとSHで8番を挟む。",readjust:"SB経由で{B}のブロックを横に動かし、逆サイドの大外（WG）へ大きく展開する。",exception:"{B}のSBが8番まで前に出て捕まえる（マンツーマン寄り）なら、WGの背後へのランが主な狙いに変わる。",sources:["cv-442","cv-433","sv-halfspace"]},{id:"m-wide2v1",attacker:"A",phase:"final",scene:"ip-prog",evidence:"I",title:"大外2v1からのカットバック",premise:"{B}のSHが8番を見て内側に残り、{B}のSBが大外で{A}のWGとSBの2人を見ている。",setup:"大外は{A}のWG＋SB vs {B}のSBで2v1。PA内は{A}のCF＋逆WG＋8番 vs {B}の2CB＋逆SB。",phenomenon:"WGが内側へ運ぶとSBが外を追い越す（逆も可）。{B}のSBはどちらか一方しか止められない。",aim:"PA角からのカットバックを、遅れて入る8番や逆WGへ。",counter:"SHが下がって大外を2v2に戻す（6バック気味）。CMがスライドしてPA前を埋める。",readjust:"{B}のSHが下がった分、PA前で8番が空く。そこからのミドルシュートや縦パスへ。",exception:"WGに1v1で仕掛ける質がない、またはSBの攻撃参加が遅いと2v1は作れない。",sources:["cv-433","cv-442"]},{id:"m-press-gk",attacker:"B",phase:"buildup",scene:"oop-press",evidence:"I",title:"{A}のハイプレス：WGがSBを消し、GKが{B}の+1になる",premise:"{A}がCF＋2WGで第1ラインを作り、8番が{B}のCMへジャンプしてくる。",setup:"{B}は2CB＋2CM＋GK、{A}はCF・WG2枚・8番2枚。WGがCBとSBの間から寄せてSBへのコースを消し、CFが逆CBへのパスを切る。",phenomenon:"ボールサイドは閉じられるが、GKを使えば{B}は1人余る。GK経由で逆サイドのCB→SBへ出られると、{A}の逆WGとSBが遅れて押し上げることになる。",aim:"GKを使った逆サイドへの展開、または2トップへのロングボールでプレスを一気に越える。",counter:"GKへのバックパスをトリガーに逆WGがCBへ、{A}のSBが{B}のSBへ縦にスライドする。6番はロングボールの落下点とセカンドに備える。",readjust:"{B}はSHを内側に絞らせてセカンドボールの回収人数を増やしてから、2トップへ蹴る。",exception:"{B}のGKが足元で数的優位を使えない場合、{A}のプレスは前線5人でほぼ完結する。",sources:["cv-433","cv-highpress","cv-442"]},{id:"m-longball",attacker:"B",phase:"progression",scene:"oop-press",evidence:"I",title:"2トップへのロングボールとセカンド回収",premise:"{A}が高い位置から人数をかけてプレスし、{B}の足元のビルドアップが詰まっている。",setup:"{B}の2トップ vs {A}の2CB。6番が下がれば3v2だが、下がらなければ2v2。",phenomenon:"1人が競り、もう1人がフリックの背後（CBとSBの間のチャネル）へ走る。{A}のSBが高い位置にいるとチャネルが広い。",aim:"落としたボールを{B}のCM・SHが前向きで拾い、2列目から攻める。",counter:"CB1枚が競り、もう1枚がカバー。6番が落下点の前でセカンドを拾い、SBは高さを下げてチャネルを閉じる。",readjust:"{B}はSHを内側へ絞らせてセカンド回収の人数を増やす。",exception:"{B}の2トップが空中戦で劣るとロングボールは単なるボールロストになる。",sources:["cv-twoupfront","cv-442"]},{id:"m-wide-overload",attacker:"B",phase:"wide",scene:"oop-block",evidence:"I",title:"WGの帰陣が遅れると大外で2v1",premise:"{A}のWGが攻撃後に高い位置に残り、4-1-4-1のブロックへの戻りが遅い。",setup:"大外で{B}のSB＋SH vs {A}のSBが2v1。{A}の8番がスライドしなければ解消できない。",phenomenon:"{B}のSBが追い越し、{A}のSBはSHとSBの2人を見ることになる。8番が外へ出ると、6番が中央で1人になる。",aim:"大外の2v1からクロス。2トップでニアとファーを同時に攻める。",counter:"WGを中盤ラインまで戻して4-1-4-1を保つ。間に合わなければ8番が外へスライドし、6番はハーフスペースを優先して守る。",readjust:"{B}は8番がスライドした瞬間に、中央（6番の脇）へ斜めのパスを入れる。",exception:"{A}がWGに帰陣を求めない（前残り）設計なら、カウンターの出口と引き換えに大外の数的不利を受け入れている。",sources:["cv-433","cv-4141"]},{id:"m-drop-striker",attacker:"B",phase:"progression",scene:"oop-block",evidence:"I",title:"2トップの1人が6番の脇へ降りる",premise:"{A}が4-1-4-1で守り、8番が{B}のCMやSBへ前に出ている。",setup:"{A}の6番は1人で中央の横幅を守る。{B}の2トップの1人が降りると、{A}のCBは付いて行くかどうか迷う。",phenomenon:"降りたFWが6番の脇で前を向くか、ワンタッチで落とし、もう1人のFWが空いたCBの背後へ走る。",aim:"6番の脇で前を向き、2トップの縦関係で中央を割る。",counter:"CBが前に出て潰す（6番の保護があるので出やすい）。逆のCBとSBが絞ってカバーし、8番は戻りながら挟む。",readjust:"CBが前に出た瞬間、もう1人のFWがその背後へ走る。",exception:"{A}が6番の横に8番を残す（4-2-3-1寄りの守備）なら脇は空きにくい。",sources:["cv-433","cv-4141"]},{id:"m-rest-3v2",attacker:"B",phase:"transition",scene:"tr-loss",evidence:"I",title:"{A}のロスト直後：残り守備3v2と、上がったSBの裏",premise:"{A}が2-3-5で攻め、両SBが高い位置にいる状態でボールを失う。",setup:"{A}の残り守備は2CB＋6番の3人、{B}は2トップ。3v2だが、6番が即時奪回に出ると2v2。",phenomenon:"{B}は奪った最初のパスで、2トップの足元か、上がった{A}のSBの背後（CBとSBの間）へボールを出す。",aim:"2トップの1人が背後へ、もう1人が足元で起点。逆SHが外から全力で追い越す。",counter:"ボール周辺の8番・CF・WGで即時奪回（カウンタープレス）。6番は出ずに縦パスのコースを消し、CBは降りるFWを前で潰す。",readjust:"{A}は片SBを残して3+1にする（3-2-5）。攻撃の人数は減るがカウンターのリスクを下げる。",exception:"{B}がSHまで低い位置で守っているとカウンターの人数が足りず、2トップだけの攻撃になる。",sources:["cv-restdef","forcher2023rest","peters2025","cv-counterpress"]},{id:"m-counter-wide",attacker:"A",phase:"transition",scene:"tr-win",evidence:"I",title:"{B}のSBが上がった背後へ、WGが最初のパスを受ける",premise:"{B}がSHを内側に入れ、SBを高く上げて攻めている最中に、{A}が中央でボールを奪う。",setup:"{A}のWGは4-1-4-1のブロックで大外・中盤の高さにいる。{B}の最終ラインは2CB（＋CM2枚）。",phenomenon:"{B}のSBの背後に{A}のWGが残っているため、最初のパスを外へ出せば、{B}の2CBに{A}のWG・CF・逆WGの3人で向かえる。",aim:"8番からWGへ外へ出し、WGが運ぶ間にCFと逆WGがPAへ入る。",counter:"{B}のCM1枚がすぐに遅らせ、もう1枚とSHが戻る。ファウルで止める判断も含め、最初のパスを外へ出させない。",readjust:"{A}の6番・8番が追い越しを遅らせず、2列目の人数を加える。",exception:"{B}がSBを上げずに4枚を残して攻めているなら、このカウンターは成立しにくい。",sources:["cv-433","cv-att-transitions"]}],adjustments:[{id:"adj-4411",by:"B",scene:"adj-b-4411",title:"FW1枚を6番番に下げる（4-4-1-1）",trigger:"{A}の6番が2トップの背後で前を向き続ける。",change:"片方のCFが6番をマークし、もう一方が1人でCB2枚を見る。",effect:"6番は消えるが、第1ラインは{A}の2CB vs CF1枚の2v1。CBが運べる。",response:{by:"A",text:"フリーのCBが運んで{B}のSHかCMを1枚引き出す。8番が6番の横へ降りて受け手を2人にする。"}},{id:"adj-invert",by:"A",scene:"adj-a-invert",title:"SBをインバートして2ピボット化（3-2-5）",trigger:"{B}の2トップのカバーシャドウで6番が消される。",change:"左SBが6番の横へ入り、右SBは残って3バックの右に。",effect:"2トップでは2CB＋2ピボットを同時に消せず、{B}はCMを前に出すしかない。CMが出た背後で8番が前を向く。",response:{by:"B",text:"SHが内側に絞ってインバートしたSBを捕まえる。その分、大外で{A}のWGと{B}のSBが1v1になる。"}},{id:"adj-6back",by:"B",title:"SHを最終ラインまで下げる（6バック気味）",trigger:"大外の2v1からクロスやカットバックを作られる。",change:"SHが{A}のSBに付いて最終ラインの外まで下がる。",effect:"大外は2v2で止まるが、中盤ラインがCM2枚だけになり、PA前で{A}の8番・6番が空く。",response:{by:"A",text:"8番をPA前に置き、カットバックとミドルシュートの受け手にする。"}},{id:"adj-press442",by:"A",title:"8番を1枚上げて4-4-2型でプレス",trigger:"{B}がGK経由で逆サイドへ逃げ、プレスを外される。",change:"8番の1枚がCFの横へ上がってCB2枚を2人で見る。WGは{B}のSBへ。",effect:"GKの+1を消しやすくなるが、6番の横の人数が減る。ロングボールが通るとセカンド回収で数的不利になる。",response:{by:"B",text:"2トップへ早めに蹴り、SHを内側に絞らせてセカンドボールを拾う。"}}],setPieces:[{title:"{A}の攻撃CK",text:"{B}がFWを1〜2人前線に残すと、{A}は2CB＋6番（＋SB）をカウンター対応に残す必要があり、PA内に送れる人数が減る。",evidence:"I"},{title:"{B}の攻撃CK",text:"{B}は2CB＋2トップの4人を空中戦に送りやすい。{A}は前線3人のうち誰をカウンターの出口に残すかと、PA内のマーク人数のトレードオフになる。",evidence:"I"},{title:"セカンドボール",text:"PA外の回収地点では{A}の8番2枚と{B}のCM2枚が競る。ここで負けると2次攻撃が続く。",evidence:"I"},{title:"スローイン",text:"通常配置から独立した局面。ボールサイドは{A}のSB・WG・8番と{B}のSB・SH・CMで同数になりやすく、逆サイドへの逃げ道を誰が消すかが論点。",evidence:"P"}],validity:{assumptions:["{B}は2トップを横並びに保つゾーン基準の4-4-2で守り、SHは自分の前の{A}のSBを基準に動く。","{A}はSBを高く上げ、8番がハーフスペースへ入る保持スタイル。","両チームとも公称の基本形から大きく可変しない。"],exceptions:["{B}がマンツーマン寄り（CMが8番に、FWが6番に付いて来る）なら、中央の+1は「人を引き出す」効果に変わり、CBの持ち運びと背後へのランが主題になる。","{B}がSHを最終ラインまで下げる低いブロックなら、中央の3v2より大外のポケットとクロスの質が主題になる。","{A}が保持でSBをインバートする（3-2-5）なら、6番の脇とSBの裏の構造が変わる。"],gameState:["{A}がリード：SBを1枚残して3+1の残り守備を優先しやすい。","{B}がビハインド：2トップのハイプレスとロングボールが増え、セカンドボールの争いが中心になる。"],profiles:["{A}の6番にプレス耐性がない、CBに運ぶ力がないと、3v2の+1は機能しにくい。","{B}のFWに空中戦の強さとスピードがあると、ロングボールと残り守備への圧力が増す。"]},sources:["cv-433","cv-442","cv-restdef","cv-counterpress","cv-highpress","cv-twoupfront","cv-4141","es-lavolpiana","sv-halfspace","forcher2023rest","peters2025","uefa-ucl-2223","deep-research"],scenes:[{id:"overview",tab:"overview",poss:null,title:"{A} vs {B}：噛み合わせ（基本配置）",short:"基本配置",caption:"中盤中央は{A}の6番＋8番2枚 vs {B}のCM2枚で3v2 ess"],sources:["cv-glossary"]},{id:"depth",cat:"space",ja:"深さ（段差）",en:"Depth",aliases:["縦の段差"],short:"縦方向の配置差。最終ラインの裏を狙う選手と、ライン間に立つ選手で相手を縦に引き延ばす。",long:"同じ高さに並ぶと1本のパスで複数人が外されやすく、段差があるとパスの角度とカバーが生まれる。4-4-2の弱点として挙げられる「段差の少なさ」はこの意味。",related:["line-breaking","compactness"],sources:["cv-442"]},{id:"half-space",cat:"space",ja:"ハーフスペース",en:"Half-space",aliases:["HS"],i18n:{de:"Halbraum",es:"carril interior",it:"mezzo spazio"},short:"中央とサイドの間にある2本の縦レーン。斜めのパスと走路が生まれやすい。",long:"ピッチを縦に5分割したときの2番目と4番目のレーン（目安はPAの外縁からゴールエリアの外縁まで）。保持者は中央とほぼ同じ選択肢を持ちながら、外へも中へも斜めに展開できる。独語 Halbraum に由来し、Spielverlagerung の議論で広まったとされる。",related:["five-lanes","pocket"],sources:["sv-halfspace","cv-glossary"]},{id:"pocket",cat:"space",ja:"ポケット",en:"Pocket",aliases:[],short:"守備ライン間・選手間の受け場所。PA脇のCBとSBの間を指すことも多い。",long:"相手が誰も捕まえにくい隙間。ここで前を向いた選手からカットバックや斜めの縦パスが生まれる。",related:["half-space","channel"],sources:[]},{id:"channel",cat:"space",ja:"チャネル",en:"Channel",aliases:["CB-SB間"],short:"CBとSBの間などの縦の通路。裏抜けとロングボールの狙い所。",long:"SBやWBが前に出た直後、外CBがWGに釣られた直後に広がる。2トップの片方が流れて起点を作る場所でもある。",related:["pocket","rest-defence"],sources:[]},{id:"five-lanes",cat:"space",ja:"5レーン",en:"Five lanes",aliases:[],short:"ピッチを縦に5本へ分けて立ち位置を整理する考え方。",long:"大外2本・ハーフスペース2本・中央1本。保持では各レーンに選手を置いて相手の守備者を分散させる。本サイトの図では「5レーン」レイヤーで表示できる。",related:["half-space","width"],sources:["sv-halfspace"]},{id:"pin",cat:"positioning",ja:"ピン留め",en:"Pinning",aliases:["固定"],short:"相手をその位置から動けなくする立ち位置。",long:"大外のWGが相手SBを外に留めると、SBとCBの間が広がる。2トップが相手CB2枚を固定すると、CBが前に出て潰しにくくなる。",related:["width","superiority"],sources:["cv-442"]},{id:"overload",cat:"positioning",ja:"オーバーロード",en:"Overload",aliases:["数的優位を作る"],short:"特定のエリアに人数をかけて数的優位を作ること。",long:"片側に人数を集めて相手を寄せ、逆サイドの1v1（アイソレーション）を作る使い方もある。",related:["isolation","superiority"],sources:["cv-thirdman"]},{id:"isolation",cat:"positioning",ja:"アイソレーション",en:"Isolation",aliases:[],short:"意図的に1対1を作ること。",long:"逆サイドに人数を集めてから、大外で待つWGへ展開して1v1を作る。質的優位を生かす典型的な手段。",related:["overload","superiority"],sources:[]},{id:"superiority",cat:"positioning",ja:"数的・位置的・質的優位",en:"Numerical / positional / qualitative superiority",aliases:["優位性"],i18n:{es:"superioridad numérica / posicional / cualitativa"},short:"数＝人数が多い、位置＝相手を無力化する位置取り、質＝個の能力差。",long:"数的優位はそのエリアの人数差、位置的優位は相手が関与できない立ち位置（ライン間、背中側など）、質的優位は1v1や空中戦などの個の差。スペイン語圏のポジショナルプレーの議論で区別される。本サイトでは「+1」などの記号を数的優位に限って使う。",related:["free-man","overload"],sources:["es-superioridad","sv-juego"]},{id:"free-man",cat:"positioning",ja:"フリーマン",en:"Free man",aliases:["フリーの選手","浮いている選手"],i18n:{es:"hombre libre"},short:"守備側の誰にも捕まっていない選手。",long:"数的・位置的優位の結果として生まれる。図では破線の円で示す。誰がフリーになるかは相手のプレス方式で変わるため、本サイトでは必ず条件とセットで示す。",related:["superiority"],sources:["sv-juego"]},{id:"pivot",cat:"positioning",ja:"ピボット（6番・ボランチ）",en:"Pivot",aliases:["アンカー","ボランチ","6番"],i18n:{de:"Sechser / Doppelsechs",es:"pivote",it:"regista / mediano"},short:"中盤の底で配球と守備のバランスを担う選手。",long:"1人ならシングルピボット（アンカー）、2人ならダブルピボット。ダブルピボットはSBの同時前進を支えやすく、シングルピボットは脇のスペースが論点になる。",related:["salida","rest-defence"],sources:["cv-doublepivot","de-abkippen"]},{id:"build-up",cat:"ip",ja:"ビルドアップ",en:"Build-up",aliases:["組み立て"],i18n:{es:"salida de balón",it:"costruzione dal basso",pt:"saída de bola"},short:"GK・DFから組織的に前進を始める局面。",long:"FIFAの局面分類（EFI）では、相手のプレッシャーの有無でビルドアップを区別する。本サイトでは「第1ライン（ボールを持つ最後方の列）vs 相手の第1プレス」の人数から読む。",related:["salida","first-line"],sources:["fifa-ip","fifa-efi","uefa-ucl-2223"]},{id:"first-line",cat:"ip",ja:"第1ライン",en:"First line",aliases:[],short:"ビルドアップでボールを持つ最後方の列（CB・GK・降りた6番など）。",long:"相手の第1プレス（FWなど）との人数差が、ビルドアップの出発点になる。例：2CB＋6番 vs 2トップ＝3v2。",related:["build-up","superiority"],sources:[]},{id:"line-breaking",cat:"ip",ja:"ラインブレイク",en:"Line-breaking pass",aliases:["縦パス"],short:"相手の守備ラインを越えて味方に届くパス。",long:"ライン間で受ける選手（8番、10番、降りるFW）への縦パスが典型。",related:["depth","third-man"],sources:[]},{id:"third-man",cat:"ip",ja:"サードマン",en:"Third-man run",aliases:["3人目の動き"],i18n:{es:"tercer hombre",pt:"terceiro homem"},short:"2人のパス交換の間に、3人目が前向きで受ける動き。",long:"2v2の状況を数的優位に変える。受け手を捕まえに出た守備者の背後を、3人目が使う形が多い。",related:["overload","line-breaking"],sources:["cv-thirdman","cv-glossary"]},{id:"overlap",cat:"ip",ja:"オーバーラップ",en:"Overlap",aliases:[],short:"ボール保持者の外側を後ろから追い越す動き。",long:"大外で2v1を作る基本形。追い越した選手の背後（残り守備）の管理とセットで考える。",related:["underlap","rest-defence"],sources:[]},{id:"underlap",cat:"ip",ja:"アンダーラップ",en:"Underlap",aliases:["インナーラップ"],short:"ボール保持者の内側を追い越す動き。",long:"WGが大外で相手SBをピン留めしているとき、SBや8番がCBとSBの間（チャネル）へ走り込む。",related:["overlap","channel"],sources:[]},{id:"invert",cat:"ip",ja:"インバート",en:"Inverted full-back",aliases:["偽SB","偽サイドバック"],short:"SBやWBが中盤の内側へ入る動き。",long:"中央の人数を増やし、6番の横に2人目のピボットを作る。ボールを失ったときの残り守備も厚くなる。代わりに大外の人数が減る。",related:["pivot","rest-defence"],sources:["uefa-observers-2122"]},{id:"salida",cat:"ip",ja:"6番落とし（サリーダ・ラボルピアーナ）",en:"Salida lavolpiana",aliases:["アンカー落とし"],i18n:{es:"salida lavolpiana",de:"abkippender Sechser"},short:"6番がCBの間・横へ降り、第1ラインを3枚にするビルドアップ。",long:"2トップのプレスに対して3v2を作る。メキシコで指揮したリカルド・ラ・ボルペの名に由来する呼び名。代わりに中盤中央の人数が1人減る。",related:["build-up","pivot"],sources:["es-lavolpiana","de-abkippen"]},{id:"braccetto",cat:"ip",ja:"外CB（ブラッチェット）",en:"Wide centre-back (back three)",aliases:[],i18n:{it:"braccetto"},short:"3バックの左右のCB。持ち運び、WBの背後のカバー、相手WGへの対応を担う。",long:"イタリア語圏の通称。3バックが機能するかは、この選手が運べるか、WBの背後へスライドできるかで大きく変わる。",related:["channel"],sources:["cv-back3"]},{id:"block",cat:"oop",ja:"ハイ／ミドル／ローブロック",en:"High / mid / low block",aliases:[],short:"非保持で守備組織を構える高さ。",long:"FIFAの局面分類（EFI）では、ブロックの高さと保持者への圧力で区別する。本サイトの図では「ミドルブロック」を基準に、ハイプレスとローブロックを別の形として扱う。",related:["compactness","trigger"],sources:["fifa-oop","fifa-efi","cv-midblock","cv-lowblock"]},{id:"compactness",cat:"oop",ja:"コンパクトネス",en:"Compactness",aliases:[],short:"チームの縦横の距離の小ささ。",long:"位置データの研究では、チームの幅・長さ・面積などで測られる。コンパクトさは選手配置だけでなく、相手や数的関係などの文脈でも変わる。",related:["block","slide"],sources:["low2020"]},{id:"slide",cat:"oop",ja:"スライド",en:"Shift / slide",aliases:[],short:"ボールサイドへ守備ブロック全体が横に移動すること。",long:"4-4の2列はスライドしやすいとされる。中盤3枚（5-3-2など）は、大きなサイドチェンジに対してスライドの距離が長くなる。",related:["compactness"],sources:["cv-442","cv-inzaghi"]},{id:"jump",cat:"oop",ja:"ジャンプ",en:"Jump / step out",aliases:["前に出る"],short:"自分のラインを離れて前へ出る守備。",long:"出た選手の背後を誰が埋めるかとセットで考える。8番のジャンプは6番の脇を、WBのジャンプはチャネルを空けやすい。",related:["pressing-trap","channel"],sources:["cv-4141","cv-inzaghi"]},{id:"man-oriented",cat:"oop",ja:"マンオリエンテーション",en:"Man-oriented defending",aliases:["マンツーマン寄り"],short:"ゾーンを基準にしつつ、特定の相手を基準に位置を取る守備。",long:"相手がマン寄りで守ると、数的優位の場所よりも「人を引き出して空いた背後」を使うことが主題になる。本サイトの多くの分析は、ゾーン基準を前提条件として明記している。",related:["free-man"],sources:[]},{id:"trigger",cat:"pressing",ja:"プレッシングトリガー",en:"Pressing trigger",aliases:["プレスのスイッチ"],short:"プレスを一斉に始めるきっかけ。",long:"バックパス、SBやWBへのパス、背を向けたトラップ、浮き球などが典型。トリガーが共有されていないと、1人だけが出て背後を空ける。",related:["pressing-trap","cover-shadow"],sources:["cv-highpress"]},{id:"cover-shadow",cat:"pressing",ja:"カバーシャドウ",en:"Cover shadow",aliases:["背中で消す"],short:"寄せる選手が自分の背中で、背後の相手へのパスコースを消すこと。",long:"図では扇形の影で示す。2トップが相手CBへ寄せながら6番を背中で消せるかが、多くのマッチアップの分かれ目になる。",related:["trigger","first-line"],sources:["cv-442"]},{id:"pressing-trap",cat:"pressing",ja:"プレッシングトラップ",en:"Pressing trap",aliases:["罠"],short:"空いて見えるエリアへボールを誘い込み、複数人で一気に囲む。",long:"外へ追い出してタッチラインを使う「サイドの罠」と、内へ誘う「中央の罠」がある。",related:["trigger"],sources:["cv-highpress","cv-433"]},{id:"counterpress",cat:"transition",ja:"カウンタープレス",en:"Counter-press",aliases:["即時奪回","ゲーゲンプレス"],i18n:{de:"Gegenpressing"},short:"ボールを失った直後の即時奪回。",long:"最も近い選手が保持者へ寄せ、周囲が危険なパスコースを消す。人数をかけるほど背後が空くため、残り守備とセットで評価する。",related:["rest-defence","outlet"],sources:["cv-counterpress","cv-glossary","sb-counterpress","peters2025"],provider:{label:"StatsBomb",text:"Pressure イベント（保持者からおよそ5ヤード以内への接近）のうち、オープンプレーでのロスト後5秒以内のものを counterpress としてフラグ付けする。"}},{id:"rest-defence",cat:"transition",ja:"残り守備（レストディフェンス）",en:"Rest defence",aliases:["レストディフェンス","リスク管理"],i18n:{de:"Restverteidigung"},short:"保持中、ボールを失った場合に備えて後方に残しておく配置。",long:"2-3や3-2の形が多い。独語の Rest（残り）に由来。研究では、深いスペースと危険な相手の管理、ロスト直後の素早い奪回が成功要因とされ、相手陣でのロスト後は残り守備ゾーンの人数が被シュートと関連した。本サイトでは「2CB＋6番（2+1）」のように人数と形で表す。",related:["counterpress","channel"],sources:["cv-restdef","fo
